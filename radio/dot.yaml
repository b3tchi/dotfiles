# radio: keyboard-driven Spotify player in QML (qml6). Audio comes from
# Spotify Soloist (Spotify's official headless Connect player, closed source)
# that the app's launcher starts; on the
# Nothing Phone (1) it also shows the music on the Glyph LEDs
# (glyph/radio-glyph, started when /sys/class/leds/glyph:* is writable).
# The app lives in a separate private repo (git@github.com:b3tchi/radio, or
# $RADIO_REPO for a local clone). This dot clones it to ~/.local/src/radio
# and checks out the highest release tag (vX.Y.Z; never main). The links put
# a shim (radio/radio: sets RADIO_GOPASS, default "spotify", then runs the
# checkout's launcher) on PATH, a .desktop entry in the app menu with its
# icon (radio.svg, hicolor scalable) and keys.json
# (key rebinds: action -> key, see the app's README) in ~/.config/radio.
#
# depends: github (ssh access to the private repo), gopass (the launcher
# reads spotify/client-id, client-secret, redirect-uri, refresh-token;
# restore them from Key Vault with `gopass-kv restore spotify`).
# Soloist: the app's radio-soloist (soloist/, Go) puts Spotify's build in
# ~/.local/share/radio/soloist (refreshed when older than 30 days; builds stop
# 90 days after they were built, so re-run `rotz install radio` monthly) and,
# on musl (postmarketOS), the ~14 MB of glibc libraries it needs (Debian
# trixie over HTTPS, SHA256-checked). Needs gopass spotify/soloist-api.
# One-time after install: `radio --login-device`, then pick the device in a
# Spotify app on the same network (firewall: udp 5353 + Soloist's tcp port
# from the LAN while pairing). librespot is no longer used: Spotify refuses
# it audio keys for newer accounts (librespot#1649).
linux:
  links:
    radio: ~/.local/bin/radio
    radio.desktop: ~/.local/share/applications/radio.desktop
    radio.svg: ~/.local/share/icons/hicolor/scalable/apps/radio.svg
    keys.json: ~/.config/radio/keys.json
  installs:
    depends:
      - github
      - gopass
    cmd: |
      {{#if (eq whoami.distro "Manjaro Linux")}}
      sudo pacman -S --needed --noconfirm qt6-declarative jq libpulse go
      {{/if}}
      {{#if (eq whoami.distro "Arch Linux")}}
      sudo pacman -S --needed --noconfirm qt6-declarative jq libpulse go
      {{/if}}
      {{#if (eq whoami.distro "Arch Linux ARM")}}
      sudo pacman -S --needed --noconfirm qt6-declarative jq libpulse go
      {{/if}}
      if command -v apk >/dev/null 2>&1; then
        missing=""
        # qml6 ships in the -dev package on Alpine
        command -v qml6 >/dev/null 2>&1 || missing="$missing qt6-qtdeclarative-dev"
        command -v jq >/dev/null 2>&1 || missing="$missing jq"
        # helpers (visualizer, login catcher, Soloist installer): go to build;
        # xz unpacks the Debian glibc libraries; parec captures for the Glyph
        command -v go >/dev/null 2>&1 || missing="$missing go"
        command -v xz >/dev/null 2>&1 || missing="$missing xz"
        command -v parec >/dev/null 2>&1 || missing="$missing pulseaudio-utils"
        [ -z "$missing" ] || doas apk add $missing
      fi

      REPO="${RADIO_REPO:-git@github.com:b3tchi/radio.git}"
      SRC="$HOME/.local/src/radio"
      if [ -d "$SRC/.git" ]; then
        if [ -n "$(git -C "$SRC" status --porcelain --untracked-files=no 2>/dev/null)" ]; then
          echo "radio: $SRC has local changes -- refusing to touch it." >&2
          echo "radio: resolve by hand (commit, stash or reset inside $SRC) and re-run 'rotz install radio'." >&2
          exit 1
        fi
      else
        mkdir -p "$(dirname "$SRC")"
        if ! GIT_TERMINAL_PROMPT=0 git clone --quiet --no-checkout "$REPO" "$SRC"; then
          echo "radio: git clone of $REPO failed -- nothing to link." >&2
          exit 1
        fi
      fi

      # RELEASES ONLY (newspaper/kwi3 precedent): check out the highest
      # vX.Y.Z tag, detached -- never a branch. Prerelease tags ignored.
      if ! GIT_TERMINAL_PROMPT=0 git -C "$SRC" fetch --quiet --force "$REPO" '+refs/tags/*:refs/tags/*' 2>/dev/null; then
        echo "radio: WARNING -- could not reach $REPO for release tags; using the newest tag already in $SRC." >&2
      fi
      TAG=$(git -C "$SRC" tag -l 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
      if [ -z "$TAG" ]; then
        echo "radio: no release tag (vX.Y.Z) in $REPO -- refusing to install an unreleased commit." >&2
        exit 1
      fi
      if ! git -C "$SRC" -c advice.detachedHead=false checkout --quiet --detach "$TAG" 2>/dev/null; then
        echo "radio: could not check out $TAG in $SRC -- resolve by hand and re-run 'rotz install radio'." >&2
        exit 1
      fi

      # Go helpers -> $SRC/build: radio-glyph (glyph/, the Glyph visualizer),
      # radio-callback (auth/, OAuth redirect catcher), radio-soloist
      # (soloist/, Soloist installer). Rebuilt when the release changes; each
      # built to a temp file and renamed, so a failed build never leaves a
      # half-written binary.
      TREE=$(git -C "$SRC" rev-parse 'HEAD^{tree}' 2>/dev/null || echo none)
      if [ -x "$SRC/build/radio-glyph" ] && [ -x "$SRC/build/radio-callback" ] && [ -x "$SRC/build/radio-soloist" ] &&
         [ "$(cat "$SRC/build/.tree" 2>/dev/null)" = "$TREE" ]; then
        echo "radio: helpers up to date"
      elif command -v go >/dev/null 2>&1; then
        mkdir -p "$SRC/build"
        ok=1
        for h in glyph:radio-glyph auth:radio-callback soloist:radio-soloist; do
          GTMP="$(mktemp "$SRC/build/.${h#*:}.XXXXXX")"
          if CGO_ENABLED=0 go build -C "$SRC" -o "$GTMP" "./${h%%:*}"; then
            mv -f "$GTMP" "$SRC/build/${h#*:}"
          else
            rm -f "$GTMP"; ok=0
            echo "radio: WARNING -- go build of ${h%%:*}/ failed." >&2
          fi
        done
        [ "$ok" = 1 ] && echo "$TREE" > "$SRC/build/.tree" && echo "radio: helpers built"
      else
        echo "radio: WARNING -- go missing; no helpers (Glyph LEDs, login catcher, Soloist install)." >&2
      fi

      # Window icon on KWin (kwi3): qml6 windows all report the class
      # org.qt-project.qml, so a KWin rule gives radio's window (title
      # "radio v...") the desktop file radio, and with it radio.svg. Other
      # qml6 apps (newspaper) are untouched. Idempotent; no KWin, no rule.
      if command -v kwriteconfig6 >/dev/null 2>&1 && command -v kreadconfig6 >/dev/null 2>&1; then
        F=kwinrulesrc; G=radio-window-icon
        kwriteconfig6 --file $F --group $G --key Description "radio: window icon (qml6 window -> radio.desktop)"
        kwriteconfig6 --file $F --group $G --key wmclass "org.qt-project.qml"
        kwriteconfig6 --file $F --group $G --key wmclassmatch 1
        kwriteconfig6 --file $F --group $G --key title '^radio( v.*)?$'
        kwriteconfig6 --file $F --group $G --key titlematch 3
        kwriteconfig6 --file $F --group $G --key desktopfile radio
        kwriteconfig6 --file $F --group $G --key desktopfilerule 2
        RULES=$(kreadconfig6 --file $F --group General --key rules)
        case ",$RULES," in *",$G,"*) ;; *) RULES="${RULES:+$RULES,}$G" ;; esac
        kwriteconfig6 --file $F --group General --key rules "$RULES"
        kwriteconfig6 --file $F --group General --key count "$(echo "$RULES" | tr ',' '\n' | grep -c .)"
        qdbus6 org.kde.KWin /KWin reconfigure >/dev/null 2>&1 || true
      fi

      # Spotify Soloist (+ glibc libraries on musl). A failure is a warning:
      # the app still runs and plays on other Connect devices.
      if [ -x "$SRC/build/radio-soloist" ]; then
        "$SRC/build/radio-soloist" ||
          echo "radio: WARNING -- Soloist install failed; no local playback until 'rotz install radio' succeeds." >&2
      fi
      gopass show -o spotify/soloist-api >/dev/null 2>&1 ||
        echo "radio: no Soloist API key -- gopass insert spotify/soloist-api (or gopass-kv restore spotify)"
      echo "radio: first install? pair the player once: radio --login-device"
      echo "radio: $TAG installed in $SRC (on PATH via the radio shim link)"
