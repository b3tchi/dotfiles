<?xml version="1.0" encoding="UTF-8"?>
<!-- radio: app icon. A retro tube radio, all red: red cabinet and front with
     a darker speaker grille, cream dial window and buttons, dark lower panel with two
     knobs and a tuning scale, two feet. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- feet -->
  <rect x="24" y="104" width="7" height="12" rx="2" fill="#4a1512"/>
  <rect x="97" y="104" width="7" height="12" rx="2" fill="#4a1512"/>
  <!-- cabinet -->
  <rect x="6" y="20" width="116" height="88" rx="20" fill="#7a1c18"/>
  <rect x="11" y="25" width="106" height="78" rx="15" fill="#e2564a"/>
  <rect x="14" y="28" width="100" height="72" rx="12" fill="#c93a2f"/>
  <!-- speaker grille -->
  <g stroke="#8e2420" stroke-width="2.2" stroke-linecap="round">
    <line x1="22" y1="36" x2="106" y2="36"/>
    <line x1="22" y1="42" x2="106" y2="42"/>
    <line x1="22" y1="48" x2="106" y2="48"/>
    <line x1="22" y1="54" x2="106" y2="54"/>
    <line x1="22" y1="60" x2="106" y2="60"/>
    <line x1="22" y1="66" x2="106" y2="66"/>
  </g>
  <!-- dial window and preset buttons -->
  <rect x="86" y="37" width="15" height="9" rx="2" fill="#fbf6e6" stroke="#7a1c18" stroke-width="2"/>
  <rect x="80" y="53" width="22" height="9" rx="2" fill="#7a1c18"/>
  <g fill="#fbf6e6">
    <rect x="82.5" y="55.5" width="4.5" height="4" rx="1"/>
    <rect x="88.8" y="55.5" width="4.5" height="4" rx="1"/>
    <rect x="95" y="55.5" width="4.5" height="4" rx="1"/>
  </g>
  <!-- divider strip -->
  <rect x="16" y="72" width="96" height="4" rx="2" fill="#fbf6e6"/>
  <!-- lower panel -->
  <rect x="20" y="78" width="88" height="18" rx="5" fill="#4a1512"/>
  <!-- tuning scale -->
  <g stroke="#8a7f74" stroke-width="1.6">
    <line x1="46" y1="82" x2="82" y2="82"/>
    <line x1="46" y1="85.5" x2="82" y2="85.5"/>
  </g>
  <rect x="46" y="88" width="36" height="5" rx="1" fill="#8a7458"/>
  <line x1="63" y1="81" x2="63" y2="93.5" stroke="#fbf6e6" stroke-width="1.4"/>
  <!-- knobs -->
  <g>
    <circle cx="33" cy="87" r="8.5" fill="#f6edd2" stroke="#9a8556" stroke-width="2"/>
    <circle cx="33" cy="87" r="4.5" fill="#cfc4a8"/>
    <circle cx="95" cy="87" r="8.5" fill="#f6edd2" stroke="#9a8556" stroke-width="2"/>
    <circle cx="95" cy="87" r="4.5" fill="#cfc4a8"/>
  </g>
</svg>
