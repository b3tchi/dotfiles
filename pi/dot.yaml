linux:
  links:
    settings.json: ~/.pi/agent/settings.json
    claude-bridge.json: ~/.pi/agent/claude-bridge.json
    # launcher sets CLAUDE_CONFIG_DIR=~/.claude-pi; replaces npm bin symlink
    bin/pi: ~/.local/bin/pi
    bin/claude-pi: ~/.local/bin/claude-pi
    claude-pi/settings.json: ~/.claude-pi/settings.json

  installs:
    cmd: |
      mkdir -p ~/.local/bin ~/.pi/agent
      if command -v pi >/dev/null 2>&1; then
        pi update --self
      else
        curl -fsSL https://pi.dev/install.sh | sh
      fi
      rotz link pi --force
      pi update --extensions
      # pi-claude-bridge 0.8.0 serves Opus 5.5 at 200K until it is in the measured
      # 1M list; [1m] verified on Max. Drop once upstream adds it.
      m=~/.pi/agent/npm/node_modules/pi-claude-bridge/src/models.ts
      if [ -f "$m" ] && ! grep -q '"claude-opus-5-5"' "$m"; then
        sed -i 's/^\t"claude-opus-5",$/&\n\t"claude-opus-5-5",/' "$m"
      fi
