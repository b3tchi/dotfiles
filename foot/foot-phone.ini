# Space to setup configversion
# configversion: 13fb3d2d9f97f4420f7506e72b90e77d
# Shared styling (Tokyo Night [colors-dark]) from the dotfiles; the keys below
# override it for the phone (kwi3 cell size, PATH, tmux entry).
include=/home/jan/.dotfiles/foot/foot.ini
# bash -> tmux -> nushell layer: the dotfiles' ~/.bashrc attaches the
# session wm-launch-terminal pre-created ($TMUX_TARGET, from $mod+Return) or
# else the focused workspace's project group, falling back to "local".
shell=/usr/sbin/bash
font=Iosevka Nerd Font:pixelsize=16
# The kwi3 module on the phone is 8x20 (dotfiles kwi3/config.js), at screen
# scale 1.5: exactly 12x30 device pixels a cell. Pin the row to it, or foot
# rounds its own line height and drifts off kwi3's grid row by row.
line-height=20px
dpi-aware=no

# i3kwin writes exact pixel tile sizes; snapping to whole cells made every
# tile overhang its slot by up to 8px once titlebars were enabled.
resize-by-cells=no

# NOTE: foot 1.28.0 rejects the [colors] section outright - even sxmo's own
# /usr/share/sxmo/appcfg/foot.ini fails to parse. A single bad section makes foot
# discard the WHOLE file, so font/dpi-aware were silently inert too. Commented out
# so the rest of this config actually loads.
#[colors]
## alpha=1.0
#foreground=eaeaea
#background=303030
#regular0=1e1e1e  # black
#regular1=d54e53  # red
#regular2=b9ca4a  # green
#regular3=e6c547  # yellow
#regular4=7aa6da  # blue
#regular5=c397d8  # magenta
#regular6=70c0ba  # cyan
#regular7=eaeaea  # white
#bright0=666666   # bright black
#bright1=ff3334   # bright red
#bright2=9ec400   # bright green
#bright3=e7c547   # bright yellow
#bright4=7aa6da   # bright blue
#bright5=b77ee0   # bright magenta
#bright6=54ced6   # bright cyan
#bright7=ffffff   # bright white


[environment]
# Put ~/.local/bin on PATH for shells foot spawns, so `freecad` works as a plain
# command. foot runs a non-login shell, which never reads ~/.profile, and ash has
# no rc file for non-login shells (ENV is unset).
PATH=/home/jan/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
