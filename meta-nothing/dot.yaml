# Meta-package: the Nothing Phone (1) "spacewar" on postmarketOS - every
# device customization, Clicks keyboard case included.
# Usage (on the phone): rotz install meta-nothing
#
# `github` comes first: ssh access to GitHub (one-time login, code approved
# on another device), so the dots below can fetch the private repos.
# `git` is the global gitconfig (identity, difftastic).
# `nothing-pmos` runs the nothing-pmos repo's install.sh from
# ~/.local/src/nothing-pmos (fetched from GitHub, or pushed from the dev box;
# see its dot.yaml): usb/Clicks charger-plug recovery, suspend, gps, dtb,
# kernel modules, sensors, bluetooth, UCM, lock screen, hardening. `clicks`
# is the Clicks key mapping (hwdb + keyd).
# The rest is Core UX: `distro` (yazi, lazygit, bat, rg, fd, fzf, bottom,
# ... plus bashrc), `nushell` + `tmux` (shell layer), `nvim`, `lazygit`
# config, `gopass` (password store) - apk installs on Alpine.
# The desktop session is the `kwi3` dot, installed on its own.
#
# FLAT, like every meta: lists dots only, never another meta.
depends:
  - github
  - git
  - nothing-pmos
  - clicks
  - distro
  - nushell
  - tmux
  - nvim
  - lazygit
  - gopass
  - logseq

installs:
  # rotz needs a non-empty `cmd` beside `installs.depends`, hence the
  # informational echo (same as meta-native-kwi3).
  depends:
    - nothing-pmos
    - clicks
  cmd: |
    echo "meta-nothing: device fixes and Clicks mapping installed;"
    echo "meta-nothing: after 'sh ~/.local/src/nothing-pmos/install.sh --build', reboot."
