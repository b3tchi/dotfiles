# Git: global config (~/.gitconfig, difftastic diffs) and the global
# ignore. gitconfig sets diff.external = difft, so `git diff` fails
# without difftastic: installs.depends pulls the difftastic dot.
windows:
  links:
    gitconfig: ~/.gitconfig
    ignore: ~/.config/git/ignore

  installs:
    depends:
      - difftastic
    cmd: |
      echo "git: difftastic installed"

linux:
  links:
    gitconfig: ~/.gitconfig
    ignore: ~/.config/git/ignore
  installs:
    depends:
      - difftastic
    cmd: |
      rotz link git --force
