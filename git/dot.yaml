# Git: global config (~/.gitconfig, difftastic diffs) and the global
# ignore. gitconfig sets diff.external = difft, so `git diff` fails
# without difftastic: the installs bring it.
windows:
  links:
    gitconfig: ~/.gitconfig
    ignore: ~/.config/git/ignore

  installs:
    cmd: |
      scoop install difftastic

linux:
  links:
    gitconfig: ~/.gitconfig
    ignore: ~/.config/git/ignore
  installs:
    cmd: |
      {{#if (eq whoami.distro "Manjaro Linux")}}
      sudo pacman -Syu --needed --noconfirm difftastic
      {{/if}}
      {{#if (eq whoami.distro "Arch Linux")}}
      sudo pacman -Syu --needed --noconfirm difftastic
      {{/if}}
      {{#if (eq whoami.distro "Arch Linux ARM")}}
      sudo pacman -Syu --needed --noconfirm difftastic
      {{/if}}
      {{#if (eq env.HOME "/data/data/com.termux/files/home")}}
      pkg install -y difftastic
      {{/if}}
      # Alpine-based (postmarketOS / Nura on the Nothing Phone)
      if command -v apk >/dev/null 2>&1; then
        apk info -e difftastic >/dev/null 2>&1 ||
          doas apk add difftastic
      fi
      rotz link git --force
