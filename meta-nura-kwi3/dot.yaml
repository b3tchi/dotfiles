# Meta-package: the phone (postmarketOS) with kwi3 on KWin on its own
# screen, replacing SXMO on Sway, and the headless KWin/KRdp session beside
# it (sp039).
# Usage: rotz install meta-nura-kwi3
#
# It installs the WHOLE phone session, window manager included: `kwi3-phone`
# runs the kwi3 repo's own `i3kwin/install.sh --local` on the phone, from
# the kwin-host branch, for the i3kwin script, the kwi3keys plugin,
# hotkeyd's phone build and kwi3-phone-session - the counterpart of `kwi3`
# for the X11 host. It needs nodejs and go on the phone (doas apk add).
#
# Installing it also makes kwi3 the session at every start, the way a
# meta-wsl-* sets the active WM: `kwi3-phone-session enable`, with a crash
# guard (a kwi3 that dies within 60 s leaves that start to SXMO). Back to SXMO
# at every start: `kwi3-phone-session disable`. No doas, tinydm stays on SXMO.
#
# FLAT, like every meta: lists dots only, never another meta.
#
# `hotkeyd` is the keyboard daemon (`--input kwin`, the `phone` build);
# `quickshell` the bar, launcher overlay and notification/clipboard
# windows; `foot` the terminal ($mod+Return); `sxmo` stays installed as the
# fallback session tinydm returns to when the KWin session fails to start.
#
# KNOWN GAP (sp039): the install commands of fonts, foot and quickshell
# branch on Arch / Manjaro only - on postmarketOS their links land and their
# package installs do nothing yet. The hotkeyd that runs is kwi3-phone's
# (install.sh, `-tags phone`); hotkeyd's own dot only builds the untagged
# client binary in the tree.
depends:
  - fonts
  - foot
  - hotkeyd
  - quickshell
  - sxmo
  - kwi3-phone

installs:
  # rotz needs a non-empty `cmd` beside `installs.depends`, hence the
  # informational echo (same as meta-native-kwi3).
  depends:
    - sxmo
    - kwi3-phone
  cmd: |
    echo "meta-nura-kwi3: kwi3 on KWin installed from ~/.local/src/kwi3-kwin;"
    echo "meta-nura-kwi3: load it with ~/.local/bin/i3reload (a running session keeps the old one)."
    "$HOME/.local/bin/kwi3-phone-session" enable
