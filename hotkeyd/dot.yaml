# hotkeyd — global keybinding daemon for X11 sessions (sp020, ft011).
#
# Owns the keybinding table outside i3: per-chord XIGrabKeycode (XI2, so every
# event carries the SOURCE device that produced it — core KeyPress carries no
# device identity at all) plus a persistent i3 IPC connection, so binds gain
# layers, held-modifier state, release triggers, sequences, counts and
# per-device scoping — none of which i3's bindsym table can express.
#
# NO LINKS. Every consumer runs the tree in place out of ~/.dotfiles/hotkeyd:
# the i3 escape-hatch bind and both platform overlays call
# ~/.dotfiles/hotkeyd/hotkeyd.sh directly. Linking a copy into ~/.config would
# put a SECOND daemon binary on disk, and "which table is the daemon actually
# running" is not a question worth having during a keyboard outage.
#
# X11 only (native :0, xrdp :10), and specifically X11 WITH XInput2 — the
# daemon exits 5 with a named error on a display that lacks it rather than
# falling back to core grabs, which would silently cost every event its source
# device. Sway is out of scope — no X passive grabs on Wayland at all.
#
# NO RUNTIME DEPENDENCIES (sp021, dotfiles-ylmp.16). The daemon is a static Go
# binary with its bind table compiled in; it needs no interpreter and no X
# binding package at runtime. python-xlib was this dot's one library dependency
# (adr0015 condition 1) for as long as the daemon was hotkeyd.py, and it is
# DROPPED here now that python is deleted from hotkeyd/.
#
# Dropping it here does NOT uninstall it. quickshell/dot.yaml declares
# python-xlib in its own right for qs-focus-border.py and qs-focus-dim.py,
# which query X geometry and shape directly, and those are untouched by this
# rewrite. On a machine that installs both dots the package stays; what changed
# is that hotkeyd no longer *claims* it, so a host that wants hotkeyd without
# quickshell no longer drags in a python X binding it never loads.
#
# xorg-server-xvfb stays, and stays TEST-ONLY: hotkeyd/test-hotkeyd.sh and
# hotkeyd/test-launcher.sh drive throwaway displays rather than the caller's.
#
# THE GO BUILD BELOW IS NOW WHAT THE KEYBOARD IS, ON EVERY DISPLAY. Before
# dotfiles-ylmp.16 a host that skipped it still had python serving :0, so the
# build was opt-in (ylmp.14) and then load-bearing for :10 alone (tz5e). With
# the engine table gone, hotkeyd.sh resolves this binary for every display and
# refuses LOUDLY (exit 78) when it is absent — never a silent fallback, because
# there is nothing left to fall back to. So on a host with no Go toolchain,
# skipping this build costs EVERY display its daemon, not one.
#
# It is nevertheless still GUARDED rather than hard-failing, and that is a
# deliberate trade the message below has to carry: `rotz install` staying
# complete-or-actionable (never half-applied) is worth more than failing the
# whole run here, because the failure mode is recoverable by one command and is
# named at the moment it happens. The i3 session also has an escape hatch that
# does not need this binary at all — hotkeyd-panic.sh hands the keyboard back
# to i3's own bind table — so a host in this state is degraded, not locked out.
linux:
  installs:
    cmd: |
      {{#if (eq whoami.distro "Manjaro Linux")}}
      sudo pacman -S --needed --noconfirm xorg-server-xvfb
      {{/if}}
      {{#if (eq whoami.distro "Arch Linux")}}
      sudo pacman -S --needed --noconfirm xorg-server-xvfb
      {{/if}}
      {{#if (eq whoami.distro "Arch Linux ARM")}}
      sudo pacman -S --needed --noconfirm xorg-server-xvfb
      {{/if}}

      # Go build of hotkeyd/hotkeyd from ./cmd/hotkeyd (sp021; required for
      # every display since dotfiles-ylmp.16 — see this file's header for why
      # it is still guarded rather than fatal).
      #
      # Build to a TEMP file in the SAME directory, then rename over the final
      # path -- never build IN PLACE. A `go build` that dies mid-`rotz install`
      # (disk full, SIGINT, a bad module cache mid-download) must not leave a
      # half-written `hotkeyd` binary sitting at the path hotkeyd.sh's `start`
      # will exec next time it runs; a killed temp file is harmless and is
      # overwritten (or left as debris, cleaned up) on the next run, while a
      # killed `mv` within one filesystem cannot land a partial file at all.
      if command -v go >/dev/null 2>&1; then
        # Resolve the source dir via akm-root so a non-standard clone path
        # (not ~/.dotfiles) still builds. Fall back to ~/.dotfiles, matching
        # akm-graph/dot.yaml and preview/dot.yaml's own guarded go builds.
        SRC="$HOME/.dotfiles/hotkeyd"
        if command -v akm-root >/dev/null 2>&1; then
          ROOT="$(akm-root 2>/dev/null || true)"
          if [ -n "$ROOT" ] && [ -d "$ROOT/hotkeyd" ]; then
            SRC="$ROOT/hotkeyd"
          fi
        fi
        TMP="$(mktemp "$SRC/.hotkeyd.build.XXXXXX")"
        if CGO_ENABLED=0 go build -C "$SRC" -o "$TMP" ./cmd/hotkeyd; then
          mv -f "$TMP" "$SRC/hotkeyd"
          echo "hotkeyd: built $SRC/hotkeyd from ./cmd/hotkeyd (this binary is \
      the daemon on EVERY display)"
        else
          rm -f "$TMP"
          echo "hotkeyd: go build FAILED -- $SRC/hotkeyd left unchanged. If it \
      was never built, every display is now without a keybinding daemon and \
      'hotkeyd.sh start' will refuse with exit 78 until this succeeds; i3's own \
      binds still work via 'hotkeyd-panic.sh panic'." >&2
        fi
      else
        echo "hotkeyd: no Go toolchain on PATH -- skipping the go build \
      (install go, then re-run 'rotz install hotkeyd'). Since dotfiles-ylmp.16 \
      there is no python engine to fall back to, so until this build succeeds \
      EVERY display is without a keybinding daemon and 'hotkeyd.sh start' will \
      REFUSE with exit 78 -- by design, it never silently starts something \
      else. i3's own bind table is still reachable via 'hotkeyd-panic.sh \
      panic'." >&2
      fi
