# logseq — the Logseq app. No graphs: those are opened in the app itself.
#
# Alpine (the phone, postmarketOS/Nura, aarch64 musl): upstream's Linux
# builds are glibc-only, so it comes from Flathub (com.logseq.Logseq, has an
# aarch64 build and its own runtime; the classic file-graph 0.10 line). The
# phone's KWin runs without Xwayland, so the app is told to use Wayland
# (socket override + explicit Ozone flags in the launcher).
# ~/.local/bin/logseq starts it, as on Manjaro, with ambient caps dropped
# first (see the setpriv note below).
windows:
  installs: scoop install logseq

linux:
  installs:
    cmd: |
      {{#if (eq whoami.distro "Manjaro Linux")}}
        gh release download --repo logseq/logseq --pattern '*.AppImage' --output logseq
        chmod +x logseq
        mv -f logseq ~/.local/bin/
      {{/if}}
      if command -v apk >/dev/null 2>&1; then
        set -e
        # --no-interactive: under rotz an apk [Y/n] question would not show
        command -v flatpak >/dev/null 2>&1 || doas apk add --no-interactive flatpak
        flatpak remote-add --user --if-not-exists flathub \
          https://dl.flathub.org/repo/flathub.flatpakrepo
        flatpak install --user --noninteractive flathub com.logseq.Logseq
        flatpak override --user --socket=wayland \
          --env=ELECTRON_OZONE_PLATFORM_HINT=wayland com.logseq.Logseq
        mkdir -p "$HOME/.local/bin"
        # setpriv: the phone's KWin session hands its children an ambient
        # CAP_WAKE_ALARM (started from ~/.profile, before tinydm's own
        # `setpriv --ambient-caps -all`), and bwrap refuses any caller holding
        # a capability ("Unexpected capabilities but not setuid").
        # The Ozone flags: this Electron ignores ELECTRON_OZONE_PLATFORM_HINT
        # and falls back to X11 ("Missing X server or $DISPLAY").
        printf '%s\n' '#!/bin/sh' 'exec setpriv --ambient-caps -all flatpak run com.logseq.Logseq --enable-features=UseOzonePlatform,WaylandWindowDecorations --ozone-platform=wayland "$@"' >"$HOME/.local/bin/logseq"
        chmod 755 "$HOME/.local/bin/logseq"
        # The window's Wayland app_id is "Logseq" (Electron's app name), so
        # KWin looks for Logseq.desktop for its icon; Flathub's entry is
        # com.logseq.Logseq.desktop, and tinydm never sources the
        # /etc/profile.d/flatpak.sh that would put its exports dir on
        # XDG_DATA_DIRS. This entry matches the app_id, names the exported
        # icon by path and starts the launcher above.
        mkdir -p "$HOME/.local/share/applications"
        printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=Logseq' \
          'Comment=A privacy-first, open-source platform for knowledge management and collaboration.' \
          "Exec=$HOME/.local/bin/logseq %U" \
          "Icon=$HOME/.local/share/flatpak/exports/share/icons/hicolor/scalable/apps/com.logseq.Logseq.svg" \
          'StartupWMClass=Logseq' 'Categories=Utility;Office;' \
          'MimeType=x-scheme-handler/logseq;' 'Terminal=false' \
          >"$HOME/.local/share/applications/Logseq.desktop"
        echo "logseq: $(flatpak info --user com.logseq.Logseq | sed -n 's/^ *Version: //p') installed (Flathub)"
      fi
