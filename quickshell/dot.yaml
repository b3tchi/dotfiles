# Replaces: rofi (launcher), dunst (notifications), polybar/waybar (bar)
# Requires: i3 or sway (WM)
# Extras (X11/i3 only):
#   python-xlib      — qs-focus-border.py / qs-focus-dim.py (X11 geometry +
#                      shape queries). It was also qs-keymon.py's dependency
#                      until hotkeyd took the alt-tab switcher and that helper
#                      was deleted (dotfiles-hwds.40); the dep stays because
#                      the focus helpers still need it.
#   xorg-xinput      — dvorak keyboard lookup at i3 startup
#   python-cairo,
#   python-gobject,
#   libwnck3, gtk3   — dependencies of quickshell/xborders-patched, our
#                      local fork of xborders that skips frameless windows
#   libnotify        — `notify-send`, the honest client for the notification
#                      daemon this package ships, and what its two suites
#                      drive it with. Not load-bearing: both fall back to a
#                      gdbus stand-in where it is absent (dotfiles-qa5m), so
#                      this buys realism on a desktop, not runnability.
linux:
  links:
    config: ~/.config/quickshell
    overlay: ~/.config/quickshell-overlay
    notif: ~/.config/quickshell-notif
  installs:
    cmd: |
      {{#if (eq whoami.distro "Manjaro Linux")}}
      sudo pacman -S --needed --noconfirm \
        quickshell python-xlib xorg-xinput \
        python-cairo python-gobject libwnck3 gtk3 \
        scrot imagemagick xclip libnotify
      {{/if}}
      {{#if (eq whoami.distro "Arch Linux")}}
      sudo pacman -S --needed --noconfirm \
        quickshell python-xlib xorg-xinput \
        python-cairo python-gobject libwnck3 gtk3 \
        scrot imagemagick xclip libnotify
      {{/if}}
      {{#if (eq whoami.distro "Arch Linux ARM")}}
      sudo pacman -S --needed --noconfirm \
        quickshell python-xlib xorg-xinput \
        python-cairo python-gobject libwnck3 gtk3 \
        scrot imagemagick xclip libnotify
      {{/if}}
      rotz link quickshell --force
