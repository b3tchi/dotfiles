# newspaper: keyboard-driven Inoreader reader in pure QML (qml6).
# The app lives in a separate private repo (git@github.com:b3tchi/newspaper,
# or $NEWSPAPER_REPO for a local clone). This dot clones it to
# ~/.local/src/newspaper, fast-forwards it to origin/main on each install,
# and links the launcher to ~/.local/bin/newspaper. No build step.
#
# depends: github (ssh access to the private repo), gopass (the launcher
# reads newspaper/client-id, client-secret, redirect-uri, refresh-token).
# mpv + yt-dlp play HLS (Bluesky) and YouTube; the Mpv QML plugin (built here
# from mpvqml/ with cmake) embeds them in the app, else external mpv.
linux:
  installs:
    depends:
      - github
      - gopass
    cmd: |
      {{#if (eq whoami.distro "Manjaro Linux")}}
      sudo pacman -S --needed --noconfirm qt6-declarative qt6-imageformats qt6-multimedia qt6-multimedia-ffmpeg jq mpv yt-dlp inotify-tools cmake base-devel pkgconf
      {{/if}}
      {{#if (eq whoami.distro "Arch Linux")}}
      sudo pacman -S --needed --noconfirm qt6-declarative qt6-imageformats qt6-multimedia qt6-multimedia-ffmpeg jq mpv yt-dlp inotify-tools cmake base-devel pkgconf
      {{/if}}
      {{#if (eq whoami.distro "Arch Linux ARM")}}
      sudo pacman -S --needed --noconfirm qt6-declarative qt6-imageformats qt6-multimedia qt6-multimedia-ffmpeg jq mpv yt-dlp inotify-tools cmake base-devel pkgconf
      {{/if}}
      if command -v apk >/dev/null 2>&1; then
        missing=""
        apk info -e qt6-qtdeclarative >/dev/null 2>&1 || missing="$missing qt6-qtdeclarative"
        apk info -e qt6-qtimageformats >/dev/null 2>&1 || missing="$missing qt6-qtimageformats"
        apk info -e qt6-qtmultimedia >/dev/null 2>&1 || missing="$missing qt6-qtmultimedia"
        command -v jq >/dev/null 2>&1 || missing="$missing jq"
        command -v mpv >/dev/null 2>&1 || missing="$missing mpv"
        command -v yt-dlp >/dev/null 2>&1 || missing="$missing yt-dlp"
        command -v inotifywait >/dev/null 2>&1 || missing="$missing inotify-tools"
        # embedded player build (mpvqml): libmpv headers, Qt dev files, toolchain
        for p in mpv-dev qt6-qtbase-dev qt6-qtdeclarative-dev cmake g++ make pkgconf; do
          apk info -e "$p" >/dev/null 2>&1 || missing="$missing $p"
        done
        [ -z "$missing" ] || doas apk add $missing
      fi

      REPO="${NEWSPAPER_REPO:-git@github.com:b3tchi/newspaper.git}"
      SRC="$HOME/.local/src/newspaper"
      if [ -d "$SRC/.git" ]; then
        if [ -n "$(git -C "$SRC" status --porcelain 2>/dev/null)" ]; then
          echo "newspaper: $SRC has local changes -- not updating it." >&2
        elif ! GIT_TERMINAL_PROMPT=0 git -C "$SRC" pull --quiet --ff-only 2>/dev/null; then
          echo "newspaper: WARNING -- could not update $SRC; keeping the current checkout." >&2
        fi
      else
        mkdir -p "$(dirname "$SRC")"
        if ! GIT_TERMINAL_PROMPT=0 git clone --quiet "$REPO" "$SRC"; then
          echo "newspaper: git clone of $REPO failed -- nothing to link." >&2
          exit 1
        fi
      fi

      # Embedded video player: the Mpv QML plugin (mpvqml/) into $SRC/build/qml.
      # Rebuilt only when the mpvqml tree changes. A failed or impossible build
      # is a warning, not an error: the app falls back to the Qt player and an
      # external mpv window.
      TREE=$(git -C "$SRC" rev-parse HEAD:mpvqml 2>/dev/null || echo none)
      if [ -f "$SRC/build/qml/Mpv/qmldir" ] && [ "$(cat "$SRC/build/.mpvqml-tree" 2>/dev/null)" = "$TREE" ]; then
        echo "newspaper: Mpv plugin up to date"
      elif command -v cmake >/dev/null 2>&1 && command -v c++ >/dev/null 2>&1 &&
           pkg-config --exists mpv Qt6Quick Qt6OpenGL 2>/dev/null; then
        if cmake -S "$SRC/mpvqml" -B "$SRC/build" -DCMAKE_BUILD_TYPE=Release -Wno-dev >/dev/null &&
           cmake --build "$SRC/build" -j"$(nproc)" >/dev/null; then
          echo "$TREE" > "$SRC/build/.mpvqml-tree"
          echo "newspaper: Mpv plugin built (embedded video)"
        else
          echo "newspaper: WARNING -- Mpv plugin build failed; videos fall back to external mpv." >&2
        fi
      else
        echo "newspaper: WARNING -- cmake, a C++ compiler, libmpv or Qt 6 dev files missing; videos fall back to external mpv." >&2
      fi

      mkdir -p "$HOME/.local/bin"
      ln -sfn "$SRC/newspaper" "$HOME/.local/bin/newspaper"
      echo "newspaper: $(git -C "$SRC" rev-parse --short HEAD) linked to ~/.local/bin/newspaper"
