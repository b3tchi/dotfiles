# newspaper: keyboard-driven Inoreader reader in QML (qml6) plus a small
# C++ libmpv plugin for embedded video.
# The app lives in a separate private repo (git@github.com:b3tchi/newspaper,
# or $NEWSPAPER_REPO for a local clone). This dot clones it to
# ~/.local/src/newspaper, checks out the highest release tag (vX.Y.Z; never
# main) and builds the Mpv video plugin. The links put a shim
# (newspaper/newspaper: sets NEWSPAPER_GOPASS, default "nextcloud", then runs
# the checkout's launcher) on PATH, a .desktop entry in the app menu with
# its icon (newspaper.svg, hicolor scalable) and
# keys.json (key rebinds: action -> key, see the app's README) and
# order.json (folder order, {"folders": [names]}) in ~/.config/newspaper.
# The app rewrites order.json when folders are moved (zk / zj), through the
# link into this repo: commit it to share the order between machines.
#
# depends: github (ssh access to the private repo), gopass (the launcher
# reads newspaper/client-id, client-secret, redirect-uri, refresh-token).
# mpv + yt-dlp play HLS (Bluesky) and YouTube; the Mpv QML plugin (built here
# from mpvqml/ with cmake) embeds them in the app, else external mpv.
linux:
  links:
    newspaper: ~/.local/bin/newspaper
    newspaper.desktop: ~/.local/share/applications/newspaper.desktop
    newspaper.svg: ~/.local/share/icons/hicolor/scalable/apps/newspaper.svg
    keys.json: ~/.config/newspaper/keys.json
    order.json: ~/.config/newspaper/order.json
  installs:
    depends:
      - github
      - gopass
    cmd: |
      {{#if (eq whoami.distro "Manjaro Linux")}}
      sudo pacman -S --needed --noconfirm qt6-declarative qt6-imageformats qt6-multimedia qt6-multimedia-ffmpeg jq mpv yt-dlp inotify-tools cmake base-devel pkgconf
      {{/if}}
      {{#if (eq whoami.distro "Arch Linux")}}
      sudo pacman -S --needed --noconfirm qt6-declarative qt6-imageformats qt6-multimedia qt6-multimedia-ffmpeg jq mpv yt-dlp inotify-tools cmake base-devel pkgconf
      {{/if}}
      {{#if (eq whoami.distro "Arch Linux ARM")}}
      sudo pacman -S --needed --noconfirm qt6-declarative qt6-imageformats qt6-multimedia qt6-multimedia-ffmpeg jq mpv yt-dlp inotify-tools cmake base-devel pkgconf
      {{/if}}
      if command -v apk >/dev/null 2>&1; then
        missing=""
        apk info -e qt6-qtdeclarative >/dev/null 2>&1 || missing="$missing qt6-qtdeclarative"
        apk info -e qt6-qtimageformats >/dev/null 2>&1 || missing="$missing qt6-qtimageformats"
        apk info -e qt6-qtmultimedia >/dev/null 2>&1 || missing="$missing qt6-qtmultimedia"
        command -v jq >/dev/null 2>&1 || missing="$missing jq"
        command -v mpv >/dev/null 2>&1 || missing="$missing mpv"
        command -v yt-dlp >/dev/null 2>&1 || missing="$missing yt-dlp"
        command -v inotifywait >/dev/null 2>&1 || missing="$missing inotify-tools"
        # embedded player build (mpvqml): libmpv headers, Qt dev files, toolchain
        for p in mpv-dev qt6-qtbase-dev qt6-qtdeclarative-dev cmake g++ make pkgconf; do
          apk info -e "$p" >/dev/null 2>&1 || missing="$missing $p"
        done
        [ -z "$missing" ] || doas apk add $missing
      fi

      REPO="${NEWSPAPER_REPO:-git@github.com:b3tchi/newspaper.git}"
      SRC="$HOME/.local/src/newspaper"
      if [ -d "$SRC/.git" ]; then
        if [ -n "$(git -C "$SRC" status --porcelain --untracked-files=no 2>/dev/null)" ]; then
          echo "newspaper: $SRC has local changes -- refusing to touch it." >&2
          echo "newspaper: resolve by hand (commit, stash or reset inside $SRC) and re-run 'rotz install newspaper'." >&2
          exit 1
        fi
      else
        mkdir -p "$(dirname "$SRC")"
        if ! GIT_TERMINAL_PROMPT=0 git clone --quiet --no-checkout "$REPO" "$SRC"; then
          echo "newspaper: git clone of $REPO failed -- nothing to link." >&2
          exit 1
        fi
      fi

      # RELEASES ONLY (kwi3 precedent): check out the highest vX.Y.Z tag,
      # detached -- never a branch. A commit on main reaches this box once it
      # is tagged and the tag is pushed. Prerelease tags (v1.0.0-rc1) ignored.
      if ! GIT_TERMINAL_PROMPT=0 git -C "$SRC" fetch --quiet --force "$REPO" '+refs/tags/*:refs/tags/*' 2>/dev/null; then
        echo "newspaper: WARNING -- could not reach $REPO for release tags; using the newest tag already in $SRC." >&2
      fi
      TAG=$(git -C "$SRC" tag -l 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
      if [ -z "$TAG" ]; then
        echo "newspaper: no release tag (vX.Y.Z) in $REPO -- refusing to install an unreleased commit." >&2
        exit 1
      fi
      if ! git -C "$SRC" -c advice.detachedHead=false checkout --quiet --detach "$TAG" 2>/dev/null; then
        echo "newspaper: could not check out $TAG in $SRC -- resolve by hand and re-run 'rotz install newspaper'." >&2
        exit 1
      fi
      echo "newspaper: release $TAG"

      # Embedded video player: the Mpv QML plugin (mpvqml/) into $SRC/build/qml.
      # Rebuilt only when the mpvqml tree changes. A failed or impossible build
      # is a warning, not an error: the app falls back to the Qt player and an
      # external mpv window.
      TREE=$(git -C "$SRC" rev-parse HEAD:mpvqml 2>/dev/null || echo none)
      if [ -f "$SRC/build/qml/Mpv/qmldir" ] && [ "$(cat "$SRC/build/.mpvqml-tree" 2>/dev/null)" = "$TREE" ]; then
        echo "newspaper: Mpv plugin up to date"
      elif command -v cmake >/dev/null 2>&1 && command -v c++ >/dev/null 2>&1 &&
           pkg-config --exists mpv Qt6Quick Qt6OpenGL 2>/dev/null; then
        if cmake -S "$SRC/mpvqml" -B "$SRC/build" -DCMAKE_BUILD_TYPE=Release -Wno-dev >/dev/null &&
           cmake --build "$SRC/build" -j"$(nproc)" >/dev/null; then
          echo "$TREE" > "$SRC/build/.mpvqml-tree"
          echo "newspaper: Mpv plugin built (embedded video)"
        else
          echo "newspaper: WARNING -- Mpv plugin build failed; videos fall back to external mpv." >&2
        fi
      else
        echo "newspaper: WARNING -- cmake, a C++ compiler, libmpv or Qt 6 dev files missing; videos fall back to external mpv." >&2
      fi

      # Window icon on KWin (kwi3): qml6 windows all report the class
      # org.qt-project.qml, so a KWin rule gives newspaper's window (title
      # "newspaper v...") the desktop file newspaper, and with it
      # newspaper.svg (same as the radio dot). Idempotent; no KWin, no rule.
      if command -v kwriteconfig6 >/dev/null 2>&1 && command -v kreadconfig6 >/dev/null 2>&1; then
        F=kwinrulesrc; G=newspaper-window-icon
        kwriteconfig6 --file $F --group $G --key Description "newspaper: window icon (qml6 window -> newspaper.desktop)"
        kwriteconfig6 --file $F --group $G --key wmclass "org.qt-project.qml"
        kwriteconfig6 --file $F --group $G --key wmclassmatch 1
        kwriteconfig6 --file $F --group $G --key title '^newspaper( v.*)?$'
        kwriteconfig6 --file $F --group $G --key titlematch 3
        kwriteconfig6 --file $F --group $G --key desktopfile newspaper
        kwriteconfig6 --file $F --group $G --key desktopfilerule 2
        # KWin 6 lists the rules in General/Order (older: rules + count)
        RULES=$(kreadconfig6 --file $F --group General --key Order)
        [ -n "$RULES" ] || RULES=$(kreadconfig6 --file $F --group General --key rules)
        case ",$RULES," in *",$G,"*) ;; *) RULES="${RULES:+$RULES,}$G" ;; esac
        kwriteconfig6 --file $F --group General --key Order "$RULES"
        qdbus6 org.kde.KWin /KWin reconfigure >/dev/null 2>&1 || true
      fi

      echo "newspaper: $TAG installed in $SRC (on PATH via the newspaper shim link)"
