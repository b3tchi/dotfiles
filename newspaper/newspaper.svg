<?xml version="1.0" encoding="UTF-8"?>
<!-- newspaper: app icon. A folded paper in the flat retro style of
     radio.svg: brown outline, cream page, masthead, a picture and three
     text lines, the back page peeking out at the right. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- back page -->
  <rect x="26" y="14" width="92" height="98" rx="10" fill="#5a3a28"/>
  <rect x="31" y="19" width="82" height="88" rx="6" fill="#e6d8ad"/>
  <!-- front page -->
  <rect x="8" y="20" width="92" height="98" rx="10" fill="#5a3a28"/>
  <rect x="13" y="25" width="82" height="88" rx="6" fill="#f6edd2"/>
  <!-- masthead -->
  <rect x="21" y="33" width="66" height="14" rx="3" fill="#3d2b1f"/>
  <!-- picture -->
  <rect x="21" y="56" width="30" height="28" rx="3" fill="#8a7458"/>
  <!-- text -->
  <g stroke="#9a8556" stroke-width="5" stroke-linecap="round">
    <line x1="60" y1="60" x2="85" y2="60"/>
    <line x1="60" y1="72" x2="85" y2="72"/>
    <line x1="24" y1="96" x2="84" y2="96"/>
  </g>
</svg>
