<?xml version="1.0" encoding="UTF-8"?>
<!-- newspaper: app icon. A folded paper in the flat retro style of
     radio.svg: brown outline, cream page, masthead, headline, a picture
     and text columns, the back page peeking out at the right. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- back page -->
  <rect x="26" y="14" width="92" height="98" rx="10" fill="#5a3a28"/>
  <rect x="31" y="19" width="82" height="88" rx="6" fill="#e6d8ad"/>
  <g stroke="#b6a274" stroke-width="2.2" stroke-linecap="round">
    <line x1="98" y1="32" x2="108" y2="32"/>
    <line x1="98" y1="40" x2="108" y2="40"/>
    <line x1="98" y1="48" x2="108" y2="48"/>
    <line x1="98" y1="56" x2="108" y2="56"/>
    <line x1="98" y1="64" x2="108" y2="64"/>
  </g>
  <!-- front page -->
  <rect x="8" y="20" width="92" height="98" rx="10" fill="#5a3a28"/>
  <rect x="13" y="25" width="82" height="88" rx="6" fill="#f6edd2"/>
  <!-- masthead -->
  <rect x="19" y="31" width="70" height="12" rx="3" fill="#3d2b1f"/>
  <g fill="#f6edd2">
    <rect x="25" y="35" width="10" height="4" rx="1"/>
    <rect x="38" y="35" width="22" height="4" rx="1"/>
    <rect x="63" y="35" width="20" height="4" rx="1"/>
  </g>
  <rect x="19" y="47" width="70" height="2" rx="1" fill="#9a8556"/>
  <!-- headline -->
  <rect x="19" y="53" width="70" height="6" rx="2" fill="#7a5a2a"/>
  <!-- picture -->
  <rect x="19" y="64" width="32" height="26" rx="3" fill="#e6d8ad" stroke="#9a8556" stroke-width="2"/>
  <circle cx="42" cy="71" r="3.5" fill="#fbf6e6"/>
  <path d="M21 88 l9 -11 6 7 5 -5 8 9z" fill="#8a7458"/>
  <!-- text columns -->
  <g stroke="#9a8556" stroke-width="2.2" stroke-linecap="round">
    <line x1="57" y1="66" x2="89" y2="66"/>
    <line x1="57" y1="72" x2="89" y2="72"/>
    <line x1="57" y1="78" x2="89" y2="78"/>
    <line x1="57" y1="84" x2="83" y2="84"/>
    <line x1="21" y1="97" x2="89" y2="97"/>
    <line x1="21" y1="103" x2="76" y2="103"/>
  </g>
</svg>
