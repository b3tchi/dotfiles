linux:
  links:
    tmux.conf: ~/.tmux.conf

  installs:
    cmd: |
      {{#if (eq whoami.distro "Manjaro Linux")}}
      sudo pacman -Syu --needed --noconfirm tmux
      {{/if}}
      {{#if (eq whoami.distro "Arch Linux")}}
      sudo pacman -Syu --needed --noconfirm tmux
      {{/if}}
      {{#if (eq whoami.distro "Arch Linux ARM")}}
      sudo pacman -Syu --needed --noconfirm tmux
      {{/if}}
      {{#if (eq env.HOME "/data/data/com.termux/files/home")}}
      pkg install -y tmux
      {{/if}}
      # Alpine-based (postmarketOS / Nura on the Nothing Phone); bash too:
      # tmux.conf's default-shell is /bin/bash, Alpine ships only ash
      if command -v apk >/dev/null 2>&1; then
        apk info -e tmux bash >/dev/null 2>&1 || doas apk add tmux bash
      fi
      rotz link tmux --force
