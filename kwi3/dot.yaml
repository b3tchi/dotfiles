# kwi3 — clone, build and link the i3kwin X11 host (sp003 Task 6,
# kwi3-7m8.6), and this box's own kwi3 xrdp listener on port 3392
# (sp003 Task 7, kwi3-7m8.7). kwi3 itself lives in a SEPARATE repository
# (https://github.com/b3tchi/kwi3, or $KWI3_REPO for a local/dev clone) —
# this dot is the one place that repo and this one meet, and it owns four
# things: cloning/building it into ~/.local/src/kwi3, linking the built
# binary and its session scripts into ~/.local/bin, this machine's kwi3
# config (kwi3/config.js, linked to ~/.config/kwi3/config.js — sp004 Task 10,
# kwi3-234.10, adr0013, migrated from the old i3-syntax kwi3/config; the
# client.* palette that used to come from i3/colors.conf via an `include` is
# now copied directly into kwi3.set({palette: {...}}), since config.js has no
# include mechanism), and (root, via
# `sudo` inline below) the kwi3/xrdp/* files that give kwi3 its own xrdp
# listener on 3392, beside the stock i3 listener on 3391 that xrdp/dot.yaml
# already set up — never touching it. See kwi3/xrdp/xrdp-kwi3.service and
# xrdp/xinitrc's KWI3_SESSION branch for the rest of that mechanism.
#
# LAN access to 3392 needs the same firewall rules xrdp/dot.yaml documents
# for 3391 — admin PowerShell, never run by this dot or by any agent:
#   New-NetFirewallHyperVRule -DisplayName "WSL kwi3" -Direction Inbound `
#     -VMCreatorId '{40E0AC32-46A5-438A-A0B2-2B479E8F2E90}' `
#     -Protocol TCP -LocalPorts 3392
#   New-NetFirewallRule -DisplayName "WSL kwi3 LAN" -Direction Inbound `
#     -Protocol TCP -LocalPort 3392 -Action Allow -Profile Private `
#     -RemoteAddress LocalSubnet
#
# RELEASES ONLY (kwi3 AGENTS.md "Releases"): this dot builds the highest
# vMAJOR.MINOR.PATCH tag of ${KWI3_REPO:-https://github.com/b3tchi/kwi3},
# checked out detached - never a branch, and deliberately no ref override
# (KWI3_REF is gone). Prerelease tags (v0.2.0-rc1) are ignored. A commit on
# kwi3's main reaches this box only once it is tagged AND the tag is pushed;
# for an untagged build, `make -C i3kwin/adapters/x11` in a dev clone.
# Remote unreachable: build the newest tag already fetched, with a warning.
# No release tag at all: refuse, named. KWI3_REPO=/path/to/kwi3 (a local
# clone) still works - its tags are what is fetched.
#
# BUILD-TO-TEMP-THEN-MV (hotkeyd/akm-graph/preview precedent, dotfiles-8kro):
# i3kwin/adapters/x11/Makefile's BUILD variable is overridable from the
# command line (`BUILD :=`, not `override`d), so the whole build — object
# files, moc output, the binary — lands in a throwaway directory this dot
# creates, and only the finished binary is `mv`d over build/i3kwin-x11
# afterwards. A `make` killed mid-build (disk full, SIGINT) leaves the
# THROWAWAY directory half-written and the previous i3kwin-x11 untouched;
# a killed `mv` within one filesystem cannot land a partial file at the
# final path at all. The build-failure guard follows the same precedent
# those three dots set: a surviving previous binary warns and exits 0 (the
# whole `rotz install meta-*` this dot might be one line of should not
# abort over a stale window manager binary); nothing built at all exits 1,
# named.
#
# IDEMPOTENCE (success criterion 6): the built sha is cached next to the
# binary (build/.built-sha). A second run whose clone sha has not moved
# skips `make` entirely — this is what makes a repeated `rotz install kwi3`
# with nothing changed upstream cheap enough to run from a meta-package on
# every session bring-up, the same way hotkeyd's `exec_always ... start` is
# cheap because `start` refuses in a no-op case rather than doing work.
#
# WHY ~/.local/bin/i3kwin-x11 IS A LINK, NOT A COPY: the binary finds
# core/ and qml/ at runtime via a compile-time define
# (I3KWIN_SOURCE_DIR = the clone path, adapters/x11/Makefile's DEFS) rather
# than an installed data directory, so it only works while the clone at
# ~/.local/src/kwi3 stays where this dot put it. That is kwi3's own design
# (i3kwin/README.md), not a shortcut taken here — see AGENTS.md in the kwi3
# repo, "The binary finds core/ and qml/ via compile-time
# I3KWIN_SOURCE_DIR".
#
# NOT LINKED FROM THE CLONE: kwi3/config.js (this directory's own file,
# linked from HERE like any other dot). The clone's bar is gone: sp004
# Task 15 (kwi3-234.15) dropped the KWI3_BAR_PATH variable that used to
# point kwi3-x11-session at $SRC/i3kwin/bar/shell.qml and switched the bar
# to the DOTFILES main quickshell config - the same
# quickshell/config/shell.qml every other session runs, reached as
# ${XDG_CONFIG_HOME:-~/.config}/quickshell/shell.qml because quickshell's
# dot links that whole config directory to ~/.config/quickshell - started
# as a bare `quickshell` with no -p/-c by kwi3-x11-session itself (kwi3
# repo, i3kwin/session/kwi3-x11-session). sp004 Task 18 (kwi3-234.18) then
# deleted the i3kwin/bar/ directory itself along with the i3 codec. The
# bar has no dependency on $SRC at all any more, so there is nothing of
# the bar's for this dot to link or copy.
# What this dot must still never do is write through ~/.config/quickshell
# (kwi3-8wb.2, history worth keeping): an older install.sh/this dot's step 3
# used to `cp -a "$SRC/i3kwin/bar/." "$HOME/.config/quickshell/kwi3/"`, and
# on this box ~/.config/quickshell is a symlink into this repo's own
# top-level quickshell config (quickshell/config/shell.qml) - so the copy
# wrote an untracked quickshell/config/kwi3/ inside ~/.dotfiles, and did not
# even fix the original bug: quickshell 0.3.x stops looking at subdirectories
# the moment a top-level shell.qml exists in a search path, so `qs -c kwi3`
# still failed. See kwi3/test-bar-symlink-safe.sh.
linux:
  # hotkeyd is kwi3's keyboard (kwi3-x11-session starts it; kwi3 itself
  # holds only the panic chord), and its kwi3-session fixes only land on a
  # rebuild - so `rotz install kwi3` alone must rebuild it too, not just
  # the meta-wsl-kwi3 path (dotfiles-r0lz follow-up: a stale Aug binary
  # left $mod+Shift+q dead on kwi3 after kwi3-55l.1 had fixed it).
  depends:
    - hotkeyd

  links:
    config.js: ~/.config/kwi3/config.js

  installs:
    cmd: |
      REPO="${KWI3_REPO:-https://github.com/b3tchi/kwi3}"
      SRC="$HOME/.local/src/kwi3"

      # ---------------------------------------------------------------
      # 1. Clone (no checkout) or reuse the clone, fetch the release tags
      #    and check out the highest vX.Y.Z, detached. A dirty clone is
      #    refused BY NAME, never reset (kwi3-7m8.6 edge case).
      # ---------------------------------------------------------------
      if [ -d "$SRC/.git" ]; then
        if [ -n "$(git -C "$SRC" status --porcelain 2>/dev/null)" ]; then
          echo "kwi3: $SRC has local changes -- refusing to touch it." >&2
          echo "kwi3: resolve by hand (commit, stash or reset inside $SRC)" >&2
          echo "kwi3: and re-run 'rotz install kwi3'." >&2
          exit 1
        fi
      else
        mkdir -p "$(dirname "$SRC")"
        CLONE_LOG=$(mktemp)
        if ! git clone --quiet --no-checkout "$REPO" "$SRC" >"$CLONE_LOG" 2>&1; then
          echo "kwi3: git clone of $REPO failed and $SRC does not exist -- nothing to build." >&2
          echo "kwi3: $(tail -n1 "$CLONE_LOG")" >&2
          rm -f "$CLONE_LOG"
          exit 1
        fi
        rm -f "$CLONE_LOG"
      fi

      # Fetched from $REPO itself, not `origin`, so a changed KWI3_REPO is
      # honoured by an existing clone too.
      if ! git -C "$SRC" fetch --quiet --force "$REPO" '+refs/tags/*:refs/tags/*' 2>/dev/null; then
        echo "kwi3: WARNING -- could not reach $REPO to fetch release tags (network down?); using the newest tag already in $SRC." >&2
      fi

      TAG=$(git -C "$SRC" tag -l 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
      if [ -z "$TAG" ]; then
        echo "kwi3: no release tag (vX.Y.Z) in $REPO -- refusing to build an unreleased commit." >&2
        echo "kwi3: cut one in the kwi3 repo (AGENTS.md \"Releases\") and re-run 'rotz install kwi3'." >&2
        exit 1
      fi
      if ! git -C "$SRC" -c advice.detachedHead=false checkout --quiet --detach "$TAG" 2>/dev/null; then
        echo "kwi3: could not check out $TAG in $SRC -- resolve by hand and re-run 'rotz install kwi3'." >&2
        exit 1
      fi
      echo "kwi3: release $TAG"

      # ---------------------------------------------------------------
      # 2. Build. Guarded on the build deps and on the make result, both
      #    following the "warn+exit0 with a previous binary, exit1 named
      #    without one" rule (hotkeyd/akm-graph/preview precedent).
      # ---------------------------------------------------------------
      ADAPTER_DIR="$SRC/i3kwin/adapters/x11"
      FINAL_BIN="$ADAPTER_DIR/build/i3kwin-x11"
      SHA_MARKER="$ADAPTER_DIR/build/.built-sha"
      CUR_SHA=$(git -C "$SRC" rev-parse --short HEAD 2>/dev/null || echo unknown)

      # adapters/x11/Makefile needs g++, pkg-config and Qt6's moc (all from
      # qt6-base + qt6-declarative), plus xcb + xcb-randr (libxcb). Checked
      # up front so a missing dependency is named -- qt6-base,
      # qt6-declarative, libxcb, pkgconf -- rather than surfacing as a raw
      # pkg-config/g++ error out of `make`.
      MISSING=""
      if ! command -v pkg-config >/dev/null 2>&1; then
        MISSING="pkgconf qt6-base qt6-declarative libxcb"
      else
        pkg-config --exists Qt6Core Qt6Gui Qt6Network 2>/dev/null || MISSING="$MISSING qt6-base"
        pkg-config --exists Qt6Qml 2>/dev/null || MISSING="$MISSING qt6-declarative"
        pkg-config --exists xcb xcb-randr 2>/dev/null || MISSING="$MISSING libxcb"
      fi
      MISSING=$(echo "$MISSING" | sed -e 's/^ *//' -e 's/ *$//')
      if ! command -v g++ >/dev/null 2>&1; then
        MISSING="$MISSING${MISSING:+ }(a C++ compiler, e.g. the 'gcc' package)"
      fi

      if [ -n "$MISSING" ]; then
        if [ -x "$FINAL_BIN" ]; then
          echo "kwi3: WARNING -- missing build dependencies: $MISSING" >&2
          echo "kwi3: $FINAL_BIN is the PREVIOUS binary and is now stale." >&2
          echo "kwi3: install them (e.g. pacman -S --needed $MISSING) and re-run 'rotz install kwi3'." >&2
        else
          echo "kwi3: missing build dependencies: $MISSING" >&2
          echo "kwi3: no previously built binary exists -- there is no $FINAL_BIN to run." >&2
          echo "kwi3: install them (e.g. pacman -S --needed $MISSING) and re-run 'rotz install kwi3'." >&2
          exit 1
        fi
      elif [ -x "$FINAL_BIN" ] && [ -f "$SHA_MARKER" ] && [ "$(cat "$SHA_MARKER" 2>/dev/null)" = "$CUR_SHA" ]; then
        echo "kwi3: build/i3kwin-x11 already built at $CUR_SHA -- not rebuilding"
      else
        BUILD_LOG=$(mktemp)
        TMPBUILD=$(mktemp -d "$ADAPTER_DIR/.build.tmp.XXXXXX")
        if make -C "$ADAPTER_DIR" BUILD="$TMPBUILD" >"$BUILD_LOG" 2>&1; then
          mkdir -p "$ADAPTER_DIR/build"
          mv -f "$TMPBUILD/i3kwin-x11" "$FINAL_BIN"
          echo "$CUR_SHA" > "$SHA_MARKER"
          rm -rf "$TMPBUILD"
          rm -f "$BUILD_LOG"
          echo "kwi3: built $CUR_SHA"
        else
          if [ -x "$FINAL_BIN" ]; then
            echo "kwi3: WARNING -- build FAILED; $FINAL_BIN is the PREVIOUS binary and is now stale." >&2
            echo "kwi3: re-run 'rotz install kwi3' once the build error is fixed. Log:" >&2
            sed 's/^/kwi3:   /' "$BUILD_LOG" >&2
          else
            echo "kwi3: build FAILED and no previously built binary exists -- there is no $FINAL_BIN to run." >&2
            echo "kwi3: fix the build error and re-run 'rotz install kwi3'. Log:" >&2
            sed 's/^/kwi3:   /' "$BUILD_LOG" >&2
            rm -rf "$TMPBUILD" "$BUILD_LOG"
            exit 1
          fi
          rm -rf "$TMPBUILD" "$BUILD_LOG"
        fi
      fi

      # ---------------------------------------------------------------
      # 3. Link the binary and the generic session scripts (kwi3-7m8.5)
      #    into the clone; link this dot's own config. The bar is NOT
      #    copied or linked here at all (kwi3-8wb.2, see the header comment
      #    above) - it is the dotfiles main quickshell config, unrelated to
      #    $SRC, which kwi3-x11-session starts as a bare `quickshell` on its
      #    own. Runs whenever step 2 did not already exit 1 above -
      #    including the warn-and-continue paths, so a stale-but-present
      #    binary still gets linked (an install that degrades, not one
      #    that half-applies).
      #
      #    NEVER add a write through ~/.config/quickshell here - that path
      #    is a symlink into this repo's own top-level quickshell config on
      #    this box, and a write through it lands inside ~/.dotfiles
      #    itself as an untracked file (kwi3-8wb.2's bug).
      # ---------------------------------------------------------------
      mkdir -p "$HOME/.local/bin"
      ln -sf "$FINAL_BIN" "$HOME/.local/bin/i3kwin-x11"
      ln -sf "$SRC/i3kwin/session/kwi3-x11-session" "$HOME/.local/bin/kwi3-x11-session"
      ln -sf "$SRC/i3kwin/session/kwi3-session-env.sh" "$HOME/.local/bin/kwi3-session-env.sh"
      # kwi3-msg on PATH: nushell/actions/wm-ipc.nu (and through it
      # wm-current-workspace -> wm-launch-terminal's tmux session pick) does
      # nothing without it, so every terminal joined tmux session "local".
      ln -sf "$SRC/i3kwin/bin/kwi3-msg" "$HOME/.local/bin/kwi3-msg"

      rotz link kwi3 --force

      # ---------------------------------------------------------------
      # 4. This BOX's own kwi3 xrdp listener, port 3392 (kwi3-7m8.7). Note
      #    the source here is kwi3/xrdp/* in THIS dotfiles repo (a sibling
      #    of this dot.yaml) - not $SRC above, which is the upstream kwi3
      #    checkout step 1 cloned; the two are unrelated trees.
      #
      #    NEVER touches /etc/xrdp itself - the stock i3 instance on 3391
      #    (xrdp.service/xrdp-sesman.service) is read only where these ini
      #    files were originally diffed from, never written here, and its
      #    ActiveEnterTimestamp must be unchanged across this install
      #    (kwi3-7m8.7 criterion 2).
      #
      #    Idempotent (criterion 5): copy_if_changed below `cmp`s before
      #    ever calling `install`, so a file whose content already matches
      #    is left alone - untouched mtime, no `install` invocation, no
      #    log line claiming a write. With nothing changed, only
      #    `systemctl enable --now` runs: on a unit that is already enabled
      #    and already active that is a no-op per systemd (it neither
      #    restarts nor reloads a running unit), so it does not disturb a
      #    session already up on 3392.
      #
      #    RESTART WHEN SOMETHING CHANGED (kwi3-7m8.14). A running unit
      #    keeps the mount namespace it was started with: its BindPaths of
      #    /etc/xrdp-kwi3/sesman.ini pins the OLD inode (`install` replaces
      #    the file rather than writing into it, so not even SIGHUP sees the
      #    new one), and a changed BindPaths= only exists for a process
      #    started after daemon-reload. So when any of the four files was
      #    written, both kwi3 units are restarted - which drops any live kwi3
      #    session on 3392, and the line printed says so. It NEVER names
      #    xrdp.service or xrdp-sesman.service: those carry the i3 session
      #    on 3391, and kwi3/test-xrdp-install.sh fails if any systemctl
      #    call here names anything but the two kwi3 units.
      #
      #    A FAILED `sudo install` (password refused, read-only /etc) is
      #    reported by name and stops the step with exit 1 before any
      #    daemon-reload/enable/restart - a half-written kwi3 config is not
      #    something to start a listener on (kwi3-7m8.13 point 1).
      #
      #    KWI3_XRDP_ETC_ROOT (default /etc) lets a stub test exercise this
      #    exact shell text with no root and nothing under /etc touched -
      #    see kwi3/test-xrdp-install.sh, in the style of
      #    i3kwin/test/session-launcher-test.sh's own stub approach.
      # ---------------------------------------------------------------
      DOTROOT="$HOME/.dotfiles"
      if command -v akm-root >/dev/null 2>&1; then
        AR="$(akm-root 2>/dev/null || true)"
        if [ -n "$AR" ] && [ -d "$AR/kwi3/xrdp" ]; then
          DOTROOT="$AR"
        fi
      fi
      XRDP_SRC="$DOTROOT/kwi3/xrdp"

      copy_if_changed() {   # copy_if_changed SRC DST MODE
        _src=$1; _dst=$2; _mode=$3
        if [ -f "$_dst" ] && cmp -s "$_src" "$_dst" 2>/dev/null; then
          echo "kwi3-xrdp: $_dst unchanged"
          return 0
        fi
        if ! sudo mkdir -p "$(dirname "$_dst")" \
           || ! sudo install -m "$_mode" "$_src" "$_dst"; then
          echo "kwi3-xrdp: FAILED to install $_src -> $_dst (sudo mkdir/install failed)" >&2
          XRDP_FAILED=1
          return 1
        fi
        echo "kwi3-xrdp: wrote $_dst"
        XRDP_CHANGED=1
      }

      if [ -d "$XRDP_SRC" ]; then
        ETCROOT="${KWI3_XRDP_ETC_ROOT:-/etc}"
        KWI3_XRDP_ETC="$ETCROOT/xrdp-kwi3"
        UNIT_DIR="$ETCROOT/systemd/system"
        XRDP_CHANGED=0
        XRDP_FAILED=0
        # The ONLY units this step may ever name (see the block header).
        KWI3_UNITS="xrdp-sesman-kwi3.service xrdp-kwi3.service"

        copy_if_changed "$XRDP_SRC/xrdp.ini"                 "$KWI3_XRDP_ETC/xrdp.ini"             644
        copy_if_changed "$XRDP_SRC/sesman.ini"                "$KWI3_XRDP_ETC/sesman.ini"            644
        copy_if_changed "$XRDP_SRC/xrdp-kwi3.service"         "$UNIT_DIR/xrdp-kwi3.service"          644
        copy_if_changed "$XRDP_SRC/xrdp-sesman-kwi3.service"  "$UNIT_DIR/xrdp-sesman-kwi3.service"   644

        if [ "$XRDP_FAILED" = 1 ]; then
          echo "kwi3-xrdp: install incomplete - NOT reloading or restarting $KWI3_UNITS." >&2
          echo "kwi3-xrdp: fix the sudo failure above and re-run 'rotz install kwi3'." >&2
          exit 1
        fi

        if [ "$XRDP_CHANGED" = 1 ]; then
          sudo systemctl daemon-reload
          echo "kwi3-xrdp: daemon-reload (unit files changed)"
          sudo systemctl enable $KWI3_UNITS
          # `restart` also starts a unit that was stopped, so this covers the
          # very first install as well. Sesman first, so the listener never
          # comes up with nothing behind /run/xrdp/sesman.socket.
          echo "kwi3-xrdp: restarting $KWI3_UNITS to apply the change (drops any kwi3 session on 3392; the i3 listener on 3391 is not touched)"
          sudo systemctl restart $KWI3_UNITS
        else
          echo "kwi3-xrdp: nothing changed - daemon-reload and restart skipped"
          # Run every time, not only on a change: a unit stopped or disabled
          # by hand is put back without needing a file edit to trigger it.
          # A no-op on an already-enabled, already-active unit - see the
          # block header.
          sudo systemctl enable --now $KWI3_UNITS
        fi
      else
        echo "kwi3-xrdp: no $XRDP_SRC in this clone - skipping the kwi3 xrdp listener (port 3392 will not be set up)" >&2
      fi
