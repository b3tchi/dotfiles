# Platform overlay: WSL xrdp session (ft003 i3-config-layering, poc002)
# Owns: $term, bar. No compositor (llvmpipe — wasted CPU over RDP), no
# tray apps (no NetworkManager/pamac/battery in WSL), no autolock (RDP
# session), no setxkbmap (layout comes from the RDP client), no
# quickshell (Wayland-leaning; X11 session here).

# $mod = Mod1 here (Alt) — set via "i3wm.mod" X resource in xrdp/xinitrc,
# because vars set in this included file are invisible to the main config.
# Win/Super is captured by the Windows host in windowed RDP.

# task switcher — MOVED TO hotkeyd (sp020, dotfiles-hwds.40). The two `nop`
# grabs that were here dispatched nothing; they existed only so Tab/w would not
# leak into the focused window while quickshell/qs-keymon.py drove the switcher
# from raw XI2 events. The daemon owns the gesture now (a hold layer on $mod)
# and qs-keymon.py is deleted.

# No compositor. picom used to run here (xrender, --no-use-damage) solely to
# give the quickshell FocusBorder ARGB overlay its alpha — but no-use-damage
# repaints the whole screen on every change (full-frame RDP re-encode =
# visible glitches), and the border is shape-based now (qs-focus-border.py),
# needing no compositor at all.

# clipboard PRIMARY<->CLIPBOARD sync — no clipboard manager runs in WSL/xrdp
# (native.conf gets this from clipit). Without it, select-in-window /
# paste-in-st desyncs: st sets PRIMARY on select but pastes from CLIPBOARD.
#
# :10 is passed EXPLICITLY, like every other loop here — clip-sync.sh no
# longer trusts an inherited DISPLAY (dotfiles-rxlj: a test instance left on
# an Xvfb `:89` silently owned this job while this session stopped mirroring).
#
# The pkill this line used to carry is GONE, and deliberately: clip-sync.sh
# now takes a per-display flock and a second instance exits 0 when it loses
# the race, the same shape as clip-store.sh / clip-win-bridge.sh below. A
# pkill+restart is strictly worse — the lock lives on an open file description
# (see clip-feed.sh's header for the race that can leave NO daemon running),
# and `-f 'clip-sync\.sh$'` cannot tell this session's loop from another
# display's, so a reload here killed the other session's mirror too.
exec_always --no-startup-id ~/.i3/scripts/clip-sync.sh :10

# WSL<->Windows clipboard bridge (dotfiles-5pw) — text sync over WSL interop
# (powershell.exe), NOT xrdp-chansrv: the chansrv clipboard channel dies
# silently on long sessions/reconnects (upstream #2596, observed after 6 days)
# and can't carry images at all in 0.10.x. flock single-instance like
# clip-feed.sh — safe on reload, no pkill (see clip-feed.sh header for why a
# pkill+restart can leave NO daemon running).
exec_always --no-startup-id ~/.i3/scripts/clip-win-bridge.sh

# clipboard history (sp016, file-store backend) — backend for the
# $mod+Shift+v picker bound in the base config. One clip-store.sh loop on
# :10, the display xrdp assigns this session (see xrdp/dot.yaml), passed
# EXPLICITLY because clip-store.sh never trusts an inherited DISPLAY. The
# loop writes $XDG_RUNTIME_DIR/clip-store/:10/, which the picker in this
# session reads.
#
# Deliberately NO clip-feed.sh: the feeder exists to bridge the two X
# servers adr0004 gives the native host (:10 -> :0), and this session is
# the only display there is, so its copies already land in its own store.
# Running the feeder here would have it watch the display it is already
# serving.
#
# Safe on reload without a pkill: the loop takes a per-display flock and a
# second instance exits 0 when it loses the race (do NOT pkill+restart —
# the lock lives on an open file description, see clip-feed.sh's header for
# the race), and a loop that died is restarted by the next reload. If
# XDG_RUNTIME_DIR is unset the loop refuses loudly (exit 78) — no
# persistent fallback, and no `|| true` to swallow it.
exec_always --no-startup-id ~/.i3/scripts/clip-store.sh :10

# hotkeyd — global keybinding daemon (sp020, ft011). One per display.
#
# ARMED (dotfiles-hwds.12 + .19). Previously disarmed pending the T6 cutover;
# T6 was reverted (fd9e9f2) and the migration re-scoped, so arming now waits on
# the panic bind rather than on the cutover.
#
# What makes this safe without the cutover: $mod+Ctrl+Shift+r -> hotkeyd-panic.sh
# stops the daemon on EVERY display, links zz-fallback-binds.conf and reloads
# i3, and `start` then refuses (exit 4) while that link exists. So the worst
# case is one chord away from the setup that works today, and no autostart or
# reconnect can rearm a display behind the fallback.
#
# WAS: $mod+o owned by both the daemon table and config.common until the
# directional-group cutover (dotfiles-hwds.16). That cutover LANDED — config.common
# no longer binds it or defines `mode "nav"` (see the note at config.common's nav
# section), and i3/test-nav-mode.sh asserts their absence from i3's LOADED config
# on both $mod shapes — so the double ownership below is history, not today's state.
# The MECHANISM is kept because it still governs any future overlap: since the XI2
# port (dotfiles-hwds.13) a contested chord no longer takes BadAccess on the daemon side —
# MEASURED, the X server keeps core and XI2 passive grabs in SEPARATE conflict
# domains, so neither client refuses the other and OWNERSHIP GOES TO WHICHEVER
# GRABBED LAST. That is symmetric: core-then-XI2 gives the daemon delivery,
# XI2-then-core gives i3 delivery.
#
# What that means in practice, measured on a live session (dotfiles-f224):
#
#   fresh session          i3 mode: default   daemon layer: nav   -> DAEMON owns
#   after `i3-msg reload`  i3 mode: nav       daemon layer: —     -> i3 owns
#   after daemon SIGHUP    i3 mode: nav       daemon layer: —     -> i3 owns
#
# The daemon holds a contested chord from session start because it grabs after i3
# does. The FIRST i3 reload takes it back and the daemon never recovers it on its
# own: `exec_always ... hotkeyd.sh start` exits "already running" and spawns
# nothing (hotkeyd.sh's `start` branch), and SIGHUP re-grabs nothing at all.
# Only a daemon RESTART flips it back.
#
# While the overlap lasted both states were usable: whoever owned the chord served
# a working nav — the daemon its own layer, i3 its `mode "nav"` block — so the
# visible difference was which nav you got, not whether $mod+o worked. That is
# what made it safe to leave until dotfiles-hwds.16 collapsed the double ownership
# entirely, which it did. $mod+Ctrl+Shift+r remains a plain i3 bind that no daemon
# contests, so panic works regardless.
#
# THE TABLE ABOVE WAS MEASURED AGAINST THE PYTHON DAEMON (dotfiles-f224). There is
# no python daemon left anywhere in the estate — dotfiles-ylmp.16 deleted it and
# hotkeyd.sh's per-display engine table with it, so EVERY display is go now, not
# just :10. The table's CONCLUSION is unchanged and if anything stronger: on the
# go build SIGHUP is an explicit logged no-op that says so (`sighupMessage`,
# hotkeyd/cmd/hotkeyd/daemon.go — the table is compiled in), rather than python's
# "re-grab only the chords whose (code, mask) changed", so a restart is even more
# plainly the only thing that flips ownership back. The three measured ROWS have
# NOT been re-taken against go on a live session and no attempt has been made to
# restate them as go numbers; re-taking them is outstanding live-estate work.
#
# exec_always is safe to re-run: `start` refuses non-zero when a daemon already
# holds the display and spawns nothing. daemon_pid() still matches BOTH argv
# shapes (hotkeyd.sh's dual-argv pgrep, retained past the .16 cutover), so a
# python daemon that was already running when the cutover landed — serving from
# an unlinked inode — is still visible to `status`/`stop`. No pkill — that would
# drop every grab.
exec_always --no-startup-id ~/.dotfiles/hotkeyd/hotkeyd.sh start :10

# bmp->png clipboard-image bridge (dotfiles: image-only paste in terminal
# apps) — xrdp-chansrv 0.10.x bridges a Windows clipboard image onto this
# X CLIPBOARD as image/bmp ONLY, invisible to image/png-only readers
# (Claude Code CLI's paste among them). Republishes it as image/png too.
# Same safe-on-reload shape as clip-store.sh: per-display flock, no pkill.
exec_always --no-startup-id ~/.i3/scripts/clip-img-bridge.sh :10
