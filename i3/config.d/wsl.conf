# Platform overlay: WSL xrdp session (ft003 i3-config-layering, poc002)
# Owns: $term, bar. No compositor (llvmpipe — wasted CPU over RDP), no
# tray apps (no NetworkManager/pamac/battery in WSL), no autolock (RDP
# session), no setxkbmap (layout comes from the RDP client), no
# quickshell (Wayland-leaning; X11 session here).

# $mod = Mod1 here (Alt) — set via "i3wm.mod" X resource in xrdp/xinitrc,
# because vars set in this included file are invisible to the main config.
# Win/Super is captured by the Windows host in windowed RDP.

# quickshell task-switcher nop grabs ($mod resolves Mod1, so just the
# $mod pair — explicit Mod1 lines would duplicate and error)
bindsym $mod+Tab nop
bindsym $mod+w nop

# No compositor. picom used to run here (xrender, --no-use-damage) solely to
# give the quickshell FocusBorder ARGB overlay its alpha — but no-use-damage
# repaints the whole screen on every change (full-frame RDP re-encode =
# visible glitches), and the border is shape-based now (qs-focus-border.py),
# needing no compositor at all.

# clipboard PRIMARY<->CLIPBOARD sync — no clipboard manager runs in WSL/xrdp
# (native.conf gets this from clipit). Without it, select-in-window /
# paste-in-st desyncs: st sets PRIMARY on select but pastes from CLIPBOARD.
# pkill pattern anchored with $ so it matches the running script (cmdline ends
# in clip-sync.sh) but NOT this launcher line (sh -c cmdline ends in &) —
# an unanchored pattern self-matched and killed clip-sync before it started.
exec_always --no-startup-id pkill -f 'clip-sync\.sh$'; ~/.i3/scripts/clip-sync.sh &

# WSL<->Windows clipboard bridge (dotfiles-5pw) — text sync over WSL interop
# (powershell.exe), NOT xrdp-chansrv: the chansrv clipboard channel dies
# silently on long sessions/reconnects (upstream #2596, observed after 6 days)
# and can't carry images at all in 0.10.x. flock single-instance like
# clip-feed.sh — safe on reload, no pkill (see clip-feed.sh header for why a
# pkill+restart can leave NO daemon running).
exec_always --no-startup-id ~/.i3/scripts/clip-win-bridge.sh

# clipboard history (sp016, file-store backend) — backend for the
# $mod+Shift+v picker bound in the base config. One clip-store.sh loop on
# :10, the display xrdp assigns this session (see xrdp/dot.yaml), passed
# EXPLICITLY because clip-store.sh never trusts an inherited DISPLAY. The
# loop writes $XDG_RUNTIME_DIR/clip-store/:10/, which the picker in this
# session reads.
#
# Deliberately NO clip-feed.sh: the feeder exists to bridge the two X
# servers adr0004 gives the native host (:10 -> :0), and this session is
# the only display there is, so its copies already land in its own store.
# Running the feeder here would have it watch the display it is already
# serving.
#
# Safe on reload without a pkill: the loop takes a per-display flock and a
# second instance exits 0 when it loses the race (do NOT pkill+restart —
# the lock lives on an open file description, see clip-feed.sh's header for
# the race), and a loop that died is restarted by the next reload. If
# XDG_RUNTIME_DIR is unset the loop refuses loudly (exit 78) — no
# persistent fallback, and no `|| true` to swallow it.
exec_always --no-startup-id ~/.i3/scripts/clip-store.sh :10

# hotkeyd — global keybinding daemon (sp020, ft011). One per display.
#
# ARMED (dotfiles-hwds.12 + .19). Previously disarmed pending the T6 cutover;
# T6 was reverted (fd9e9f2) and the migration re-scoped, so arming now waits on
# the panic bind rather than on the cutover.
#
# What makes this safe without the cutover: $mod+Shift+F12 -> hotkeyd-panic.sh
# stops the daemon on EVERY display, links zz-fallback-binds.conf and reloads
# i3, and `start` then refuses (exit 4) while that link exists. So the worst
# case is one chord away from the setup that works today, and no autostart or
# reconnect can rearm a display behind the fallback.
#
# KNOWN, accepted: $mod+o is owned by both binds.py and config.common:408 until
# the directional-group cutover (dotfiles-hwds.16). i3 grabs at config load and
# the daemon takes BadAccess, so it no-ops; on an i3 reload the daemon may win
# it instead and serve its own nav layer. That is the state panic exists for.
#
# exec_always is safe to re-run: `start` refuses non-zero when a daemon already
# holds the display and spawns nothing. No pkill — that would drop every grab.
exec_always --no-startup-id ~/.dotfiles/hotkeyd/hotkeyd.sh start :10

# bmp->png clipboard-image bridge (dotfiles: image-only paste in terminal
# apps) — xrdp-chansrv 0.10.x bridges a Windows clipboard image onto this
# X CLIPBOARD as image/bmp ONLY, invisible to image/png-only readers
# (Claude Code CLI's paste among them). Republishes it as image/png too.
# Same safe-on-reload shape as clip-store.sh: per-display flock, no pkill.
exec_always --no-startup-id ~/.i3/scripts/clip-img-bridge.sh :10
