# hotkeyd FALLBACK BIND TABLE (sp020 Task 10, ft011) — NOT linked by rotz.
#
# `hotkeyd/hotkeyd-panic.sh panic` links this file into ~/.i3/config.d/ and
# reloads i3; `resume` removes the link and reloads again. It is the i3-side
# stand-in for the binds the daemon owns, so that stopping the daemon leaves
# no dead keys behind.
#
# WHAT GOES IN HERE — the i3 equivalent of whatever `hotkeyd/binds.py` owns,
# MINUS anything i3 still owns itself. That is not the same as "the binds i3
# has today"; it is close to the opposite. i3 still owns its own table, so a
# fallback restating it would declare every one of ~150 binds twice, and i3
# treats a duplicate keybinding as a CONFIG ERROR (the nagbar) rather than
# taking last-wins — the same trap `config.d/native.conf` documents above its
# `bindsym Mod4+Tab nop` pair. The `zz-` prefix only settles the
# `config.d/*.conf` glob ORDER; it grants no override, and there is nothing to
# override.
#
# So today this file binds NOTHING. `binds.py` owns exactly `$mod+o`, and
# `i3/config.common:408` still owns `$mod+o` too — i3 already answers it, so
# repeating it here would break the config rather than save the session. The
# moment the directional cutover (sp020 Task 14) deletes a group from
# `config.common` and hands it to `binds.py`, that group's i3 spelling belongs
# here, in the same commit.
#
# The rule is enforced, not remembered: `hotkeyd/test_binds.py`
# (`test_the_fallback_is_exactly_what_binds_py_owns_and_i3_does_not`) diffs the
# chords declared here against `binds.py`'s chord set minus i3's, under BOTH
# `$mod` resolutions, and `hotkeyd/test-hotkeyd.sh` runs `i3 -C` over the
# composed tree with this file linked in. A fallback that has rotted fails the
# suite instead of failing the outage it exists for.
#
# NOT IN HERE: the panic chord itself ($mod+Shift+F12). It lives in
# `i3/config.common` and never moves — binding it from the file that panic
# links in would make it a duplicate at precisely the worst moment.
#
# THERE IS NO RESUME BIND HERE EITHER, on purpose. Once panic has run, i3 owns
# the whole keyboard again, so a terminal is reachable and resume is an
# ordinary command rather than an emergency control:
#
#     ~/.dotfiles/hotkeyd/hotkeyd-panic.sh resume
#
# PANIC IS MACHINE-WIDE, NOT PER-DISPLAY. ~/.i3/config.d/ is shared: `:0` and
# `:10` both include this same glob from `i3/config`, so there is no way to
# link a file for one display only. `hotkeyd-panic.sh` therefore stops the
# daemon on EVERY display before linking, and `hotkeyd.sh start` refuses while
# the link is present — see that script's header for the full argument.

# ---------------------------------------------------------------------------
# NAV (sp020 / dotfiles-hwds.16). Added when `mode "nav"` left i3/config.common
# and hotkeyd became its sole owner.
#
# This is the whole point of the fallback: binds.py owns nav now, and grabs die
# with the daemon, so a dead or misbehaving daemon means NO nav at all until
# something gives it back. This block is that something. It is a verbatim copy
# of what was removed from config.common, so panic restores the behaviour that
# worked before the cutover — not an approximation of it.
#
# Kept honest mechanically, not by discipline: test_binds.py asserts this file
# contains exactly the chords binds.py owns and i3 does not. Migrate another
# group without updating this file and that test fails.
#
# The `nop nav-*` marker binds are deliberately INCLUDED. They are dead weight
# for the daemon (which reports modifier state on its socket) but they are how
# the BAR names the layer when i3 is serving nav, and during a panic the bar is
# the only thing telling the user which layer they are in.

bindsym $mod+o mode "nav"
mode "nav" {
        bindsym h focus left
        bindsym j focus down
        bindsym k focus up
        bindsym l focus right

        bindsym Ctrl+h move left
        bindsym Ctrl+j move down
        bindsym Ctrl+k move up
        bindsym Ctrl+l move right

        # same bindings, but for the arrow keys
        bindsym Left focus left
        bindsym Down focus down
        bindsym Up focus up
        bindsym Right focus right

        bindsym Ctrl+Left move left
        bindsym Ctrl+Down move down
        bindsym Ctrl+Up move up
        bindsym Ctrl+Right move right

        # ALT = resize layer. Directions match the standalone `resize` mode:
        # h/l shrink/grow width, k/j shrink/grow height.
        bindsym Mod1+h resize shrink width 5 px or 5 ppt
        bindsym Mod1+j resize grow height 5 px or 5 ppt
        bindsym Mod1+k resize shrink height 5 px or 5 ppt
        bindsym Mod1+l resize grow width 5 px or 5 ppt

        bindsym Mod1+Left resize shrink width 5 px or 5 ppt
        bindsym Mod1+Down resize grow height 5 px or 5 ppt
        bindsym Mod1+Up resize shrink height 5 px or 5 ppt
        bindsym Mod1+Right resize grow width 5 px or 5 ppt

        # Modifier down / up -> bar indicator only; no layout effect.
        # 37/105 = Control_L/Control_R, 64/108 = Alt_L/Alt_R (xmodmap -pm).
        bindcode 37 nop nav-move-on
        bindcode 105 nop nav-move-on
        bindcode --release Ctrl+37 nop nav-move-off
        bindcode --release Ctrl+105 nop nav-move-off
        bindcode --release 37 nop nav-move-off
        bindcode --release 105 nop nav-move-off

        bindcode 64 nop nav-resize-on
        bindcode 108 nop nav-resize-on
        bindcode --release Mod1+64 nop nav-resize-off
        bindcode --release Mod1+108 nop nav-resize-off
        bindcode --release 64 nop nav-resize-off
        bindcode --release 108 nop nav-resize-off

        # exit nav mode: Enter, Escape or q (with or without a modifier held)
        bindsym Return mode "default"
        bindsym Escape mode "default"
        bindsym Ctrl+q mode "default"
        bindsym Mod1+q mode "default"
        bindsym Shift+q mode "default"
        bindsym q mode "default"
}
