# hotkeyd FALLBACK BIND TABLE (sp020 Task 10, ft011) — NOT linked by rotz.
#
# `hotkeyd/hotkeyd-panic.sh panic` links this file into ~/.i3/config.d/ and
# reloads i3; `resume` removes the link and reloads again. It is the i3-side
# stand-in for the binds the daemon owns, so that stopping the daemon leaves
# no dead keys behind.
#
# WHAT GOES IN HERE — the i3 equivalent of whatever `hotkeyd/binds.py` owns,
# MINUS anything i3 still owns itself. That is not the same as "the binds i3
# has today"; it is close to the opposite. i3 still owns its own table, so a
# fallback restating it would declare every one of ~150 binds twice, and i3
# treats a duplicate keybinding as a CONFIG ERROR (the nagbar) rather than
# taking last-wins — the same trap `config.d/native.conf` documents above its
# `bindsym Mod4+Tab nop` pair. The `zz-` prefix only settles the
# `config.d/*.conf` glob ORDER; it grants no override, and there is nothing to
# override.
#
# This file DOES bind things, and must: the nav cutover (dotfiles-hwds.16,
# commit 71f6c4a8) deleted `$mod+o` and the whole `mode "nav"` block from
# `config.common` and handed them to `binds.py`. Grabs die with the daemon, so
# with i3 no longer owning nav a dead daemon means NO nav until something
# restores it — that something is this file, which carries the removed block
# verbatim so panic restores the behaviour that worked before the cutover
# rather than an approximation of it.
#
# (An earlier version of this header said the file binds NOTHING. That was true
# only until the cutover, and stale afterwards — dotfiles-v84s.)
#
# The rule for future groups is unchanged: the moment a cutover deletes a group
# from `config.common` and hands it to `binds.py`, that group's i3 spelling
# belongs here, in the same commit.
#
# The rule is enforced, not remembered: `hotkeyd/test_binds.py`
# (`test_the_fallback_is_exactly_what_binds_py_owns_and_i3_does_not`) diffs the
# chords declared here against `binds.py`'s chord set minus i3's, under BOTH
# `$mod` resolutions, and `hotkeyd/test-hotkeyd.sh` runs `i3 -C` over the
# composed tree with this file linked in. A fallback that has rotted fails the
# suite instead of failing the outage it exists for.
#
# NOT IN HERE: the panic chord itself ($mod+Ctrl+Shift+r), nor the
# $mod+Shift+r hammer. Both live in `i3/config.common` and are i3-owned in
# every state — binding either from the file that panic links in would make it
# a duplicate at precisely the worst moment.
#
# THERE IS NO RESUME BIND HERE EITHER, on purpose. Once panic has run, i3 owns
# the whole keyboard again, so a terminal is reachable and resume is an
# ordinary command rather than an emergency control:
#
#     ~/.dotfiles/hotkeyd/hotkeyd-panic.sh resume
#
# PANIC IS MACHINE-WIDE, NOT PER-DISPLAY. ~/.i3/config.d/ is shared: `:0` and
# `:10` both include this same glob from `i3/config`, so there is no way to
# link a file for one display only. `hotkeyd-panic.sh` therefore stops the
# daemon on EVERY display before linking, and `hotkeyd.sh start` refuses while
# the link is present — see that script's header for the full argument.

# ---------------------------------------------------------------------------
# NAV (sp020 / dotfiles-hwds.16). Added when `mode "nav"` left i3/config.common
# and hotkeyd became its sole owner.
#
# This is the whole point of the fallback: binds.py owns nav now, and grabs die
# with the daemon, so a dead or misbehaving daemon means NO nav at all until
# something gives it back. This block is that something. It is a verbatim copy
# of what was removed from config.common, so panic restores the behaviour that
# worked before the cutover — not an approximation of it.
#
# Kept honest mechanically, not by discipline: test_binds.py asserts this file
# contains exactly the chords binds.py owns and i3 does not. Migrate another
# group without updating this file and that test fails.
#
# The `nop nav-*` marker binds are deliberately INCLUDED. They are dead weight
# for the daemon (which reports modifier state on its socket) but they are how
# the BAR names the layer when i3 is serving nav, and during a panic the bar is
# the only thing telling the user which layer they are in.

bindsym $mod+o mode "nav"

# ---------------------------------------------------------------------------
# THE ENTRY-POINT GROUP (dotfiles-hwds.33). Added when terminal / launcher /
# project-picker / bar-restart left i3/config and hotkeyd/binds.py became their
# sole owner.
#
# These four hurt more than nav does when the daemon is down: without
# $mod+Return there is no terminal, and with no terminal `hotkeyd-panic.sh
# resume` is unreachable. That is the whole argument for this file.
#
# Verbatim from what i3/config carried, with ONE substitution: i3's $qsbarenv
# variable cannot be used here, because a variable set in an included overlay
# is invisible outside the file that sets it (measured — the parent sees the
# literal `$qsbarenv`, which sh then expands to nothing). The env pair is
# therefore spelled out inline, matching what binds.py runs.
# ($mod+Shift+d is absent on purpose: the bar restart folded into the
# $mod+Shift+r hammer, which i3 owns and which therefore still works while
# panicked. Nothing to restore.)
bindsym $mod+Return exec ~/.local/bin/wm-launch-terminal st
bindsym $mod+d exec ~/.dotfiles/quickshell/qs-overlay.sh launcher
bindsym $mod+p exec --no-startup-id ~/.dotfiles/quickshell/qs-overlay.sh projects

# ---------------------------------------------------------------------------
# THE WORKSPACE GROUP (dotfiles-hwds.34). Added when the number row and the
# next/prev pair left i3/config.common and hotkeyd/binds.py became their sole
# owner.
#
# A dead daemon with no workspace keys is a session you can only navigate by
# mouse, so this block matters roughly as much as the entry-point one above.
#
# Verbatim from what config.common carried, with ONE substitution: its
# `$ws_switch` variable is gone with the binds that used it, and a variable set
# in the parent would not reach this file anyway (measured — an i3 var does not
# cross a file boundary in either direction). The path is spelled out inline,
# matching what binds.py runs.
bindsym $mod+Ctrl+Right workspace next
bindsym $mod+Ctrl+Left workspace prev

bindsym $mod+1 exec --no-startup-id ~/.local/bin/ws-switch.nu 1
bindsym $mod+2 exec --no-startup-id ~/.local/bin/ws-switch.nu 2
bindsym $mod+3 exec --no-startup-id ~/.local/bin/ws-switch.nu 3
bindsym $mod+4 exec --no-startup-id ~/.local/bin/ws-switch.nu 4
bindsym $mod+5 exec --no-startup-id ~/.local/bin/ws-switch.nu 5
bindsym $mod+6 exec --no-startup-id ~/.local/bin/ws-switch.nu 6
bindsym $mod+7 exec --no-startup-id ~/.local/bin/ws-switch.nu 7
bindsym $mod+8 exec --no-startup-id ~/.local/bin/ws-switch.nu 8

bindsym $mod+Ctrl+1 exec --no-startup-id ~/.local/bin/ws-switch.nu 1 move
bindsym $mod+Ctrl+2 exec --no-startup-id ~/.local/bin/ws-switch.nu 2 move
bindsym $mod+Ctrl+3 exec --no-startup-id ~/.local/bin/ws-switch.nu 3 move
bindsym $mod+Ctrl+4 exec --no-startup-id ~/.local/bin/ws-switch.nu 4 move
bindsym $mod+Ctrl+5 exec --no-startup-id ~/.local/bin/ws-switch.nu 5 move
bindsym $mod+Ctrl+6 exec --no-startup-id ~/.local/bin/ws-switch.nu 6 move
bindsym $mod+Ctrl+7 exec --no-startup-id ~/.local/bin/ws-switch.nu 7 move
bindsym $mod+Ctrl+8 exec --no-startup-id ~/.local/bin/ws-switch.nu 8 move

bindsym $mod+Shift+1 exec --no-startup-id ~/.local/bin/ws-switch.nu 1 follow
bindsym $mod+Shift+2 exec --no-startup-id ~/.local/bin/ws-switch.nu 2 follow
bindsym $mod+Shift+3 exec --no-startup-id ~/.local/bin/ws-switch.nu 3 follow
bindsym $mod+Shift+4 exec --no-startup-id ~/.local/bin/ws-switch.nu 4 follow
bindsym $mod+Shift+5 exec --no-startup-id ~/.local/bin/ws-switch.nu 5 follow
bindsym $mod+Shift+6 exec --no-startup-id ~/.local/bin/ws-switch.nu 6 follow
bindsym $mod+Shift+7 exec --no-startup-id ~/.local/bin/ws-switch.nu 7 follow
bindsym $mod+Shift+8 exec --no-startup-id ~/.local/bin/ws-switch.nu 8 follow

# ---------------------------------------------------------------------------
# THE LAYOUT GROUP (dotfiles-hwds.36). Added when border / split / layout /
# fullscreen / sticky / scratchpad / focus-parent left i3/config.common and
# hotkeyd/binds.py became their sole owner.
#
# Verbatim from what config.common carried, including the `bellow` typo in the
# split-vertical notification. This file exists to restore what worked before
# the cutover, not a tidied-up version of it — a fallback that "improves" the
# binds it restores is a fallback nobody can diff against the original.
#
# NOT here: $mod+Shift+q (kill). It never left i3, so restating it would be a
# duplicate keybinding, which i3 treats as a config ERROR rather than
# last-wins — the nagbar at exactly the moment panic is trying to give the
# keyboard back.
bindsym $mod+u border none
bindsym $mod+y border pixel 4

bindsym $mod+s split h;exec notify-send 'tile side'
bindsym $mod+b split v;exec notify-send 'tile bellow'
bindsym $mod+q split toggle

bindsym $mod+z fullscreen toggle

bindsym $mod+t layout tabbed
bindsym $mod+e layout toggle split

bindsym $mod+Shift+p sticky toggle
bindsym $mod+a focus parent

bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus scratchpad show

# ---------------------------------------------------------------------------
# THE DIRECTIONAL GROUP (dotfiles-hwds.37). Added when $mod+hjkl / $mod+arrows
# (focus) and their $mod+Shift forms (move) left i3/config.common and
# hotkeyd/binds.py became their sole owner.
#
# This block and the `mode "nav"` block below now overlap in PURPOSE but not in
# chords, and both belong here. nav is entered by $mod+o and moves focus with
# BARE hjkl; these are the always-on forms with $mod held. Before the cutover
# i3 carried both, so a panic that restored only one would be restoring half a
# keyboard.
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right

bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right

bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# ---------------------------------------------------------------------------
# THE SYSTEM MODE (dotfiles-hwds.38). Added when $mod+0 and the session-action
# block left i3/config.common and hotkeyd/binds.py became their sole owner, as
# a one-shot layer.
#
# THIS IS THE MOST IMPORTANT BLOCK IN THIS FILE. Every other group here costs
# convenience while the daemon is down; without this one there is no keyboard
# route to LOCK a session you are walking away from, or to reboot a machine
# whose input layer is misbehaving — which is the exact situation panic exists
# for.
#
# The `set` and the `mode` block must stay together in THIS file: an i3
# variable does not cross a file boundary, so the name would resolve to the
# literal `$mode_system` if the set were left behind in config.common. Verbatim
# otherwise, including the label's long-standing lie — it advertises
# `(Shift+s)hutdown` while `p` is what shuts down, and no Shift+s bind has ever
# existed. Preserved because the bar's hint strip MATCHES ON THIS STRING
# (`ModeBarTheme.resolve` looks for `(l)ock`), so editing it here silently
# blanks the hints during a panic.
set $mode_system (l)ock, (e)xit, switch_(u)ser, (s)uspend, (h)ibernate, (r)eboot, (Shift+s)hutdown
bindsym $mod+0 mode "$mode_system"
mode "$mode_system" {
    bindsym l exec --no-startup-id i3exit lock, mode "default"
    bindsym s exec --no-startup-id i3exit suspend, mode "default"
    bindsym u exec --no-startup-id i3exit switch_user, mode "default"
    bindsym e exec --no-startup-id i3exit logout, mode "default"
    bindsym h exec --no-startup-id i3exit hibernate, mode "default"
    bindsym r exec --no-startup-id i3exit reboot, mode "default"
    bindsym p exec --no-startup-id i3exit shutdown, mode "default"

    # exit system mode: "Enter" or "Escape"
    bindsym Return mode "default"
    bindsym Escape mode "default"
    bindsym q mode "default"
}

mode "nav" {
        bindsym h focus left
        bindsym j focus down
        bindsym k focus up
        bindsym l focus right

        bindsym Ctrl+h move left
        bindsym Ctrl+j move down
        bindsym Ctrl+k move up
        bindsym Ctrl+l move right

        # same bindings, but for the arrow keys
        bindsym Left focus left
        bindsym Down focus down
        bindsym Up focus up
        bindsym Right focus right

        bindsym Ctrl+Left move left
        bindsym Ctrl+Down move down
        bindsym Ctrl+Up move up
        bindsym Ctrl+Right move right

        # ALT = resize layer. Directions match the standalone `resize` mode:
        # h/l shrink/grow width, k/j shrink/grow height.
        bindsym Mod1+h resize shrink width 5 px or 5 ppt
        bindsym Mod1+j resize grow height 5 px or 5 ppt
        bindsym Mod1+k resize shrink height 5 px or 5 ppt
        bindsym Mod1+l resize grow width 5 px or 5 ppt

        bindsym Mod1+Left resize shrink width 5 px or 5 ppt
        bindsym Mod1+Down resize grow height 5 px or 5 ppt
        bindsym Mod1+Up resize shrink height 5 px or 5 ppt
        bindsym Mod1+Right resize grow width 5 px or 5 ppt

        # Modifier down / up -> bar indicator only; no layout effect.
        # 37/105 = Control_L/Control_R, 64/108 = Alt_L/Alt_R (xmodmap -pm).
        bindcode 37 nop nav-move-on
        bindcode 105 nop nav-move-on
        bindcode --release Ctrl+37 nop nav-move-off
        bindcode --release Ctrl+105 nop nav-move-off
        bindcode --release 37 nop nav-move-off
        bindcode --release 105 nop nav-move-off

        bindcode 64 nop nav-resize-on
        bindcode 108 nop nav-resize-on
        bindcode --release Mod1+64 nop nav-resize-off
        bindcode --release Mod1+108 nop nav-resize-off
        bindcode --release 64 nop nav-resize-off
        bindcode --release 108 nop nav-resize-off

        # exit nav mode: Enter, Escape or q (with or without a modifier held)
        bindsym Return mode "default"
        bindsym Escape mode "default"
        bindsym Ctrl+q mode "default"
        bindsym Mod1+q mode "default"
        bindsym Shift+q mode "default"
        bindsym q mode "default"
}
