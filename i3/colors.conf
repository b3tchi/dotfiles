# i3 decoration palette — Jan's client.* colours, ONE source of truth for
# both readers of this block (sp003 Task 6, kwi3-7m8.6).
#
# Split out of i3/config.common, which now `include`s this file at the same
# spot the five lines used to sit. `i3/config.common` includes it with the
# absolute dotfiles path (`~/.dotfiles/i3/colors.conf`, matching how
# i3/config already includes config.common itself); kwi3/config includes it
# as `include ../i3/colors.conf`, resolved by kwi3's own rcfile reader
# relative to the DIRECTORY of the top-level config file it was handed —
# for the real session that is ~/.config/kwi3/config, a symlink rotz makes
# to ~/.dotfiles/kwi3/config, and the host resolves that symlink's TARGET
# before parsing, so `../i3/colors.conf` lands on this exact file
# (i3kwin/core/rcfile.js's header, "the top-level file is the one place a
# symlink is resolved at all").
#
# kwi3's reader (core/rcfile.js, KWI3_RCFILE_CLIENT_KEYS) only maps these
# five `client.<class>` keys — the exact five below, nothing more — so this
# file carries precisely the set both readers understand and nothing a
# second host would have to skip.
#
# client.background is DELIBERATELY NOT HERE. It lives in config.common,
# right after this include, and reads `$transp` — a variable `set` inside
# config.common itself. i3 scopes `set` variables PER FILE: a variable set
# in one file is invisible when substituted in another, in EITHER direction
# — measured on this exact box and recorded twice already (i3/config's own
# header comment on `$mod`, and hotkeyd/i3/config.d/zz-fallback-binds.conf's
# "an i3 var does not cross a file boundary in either direction"). Moving
# `client.background $transp` here would either resolve to the literal text
# `$transp` (a config parse error i3 reports, not a colour) or require
# duplicating `set $transp ...` in this file too — a second source of truth
# for one value, exactly what this split exists to avoid. Also: kwi3's own
# KWI3_RCFILE_CLIENT_KEYS does not read client.background at all, so kwi3
# has no use for it either. Verified against a real `i3 -C` — see
# kwi3-7m8.6's bd notes for the command and output.
#
# class                   border  backgr. text    indic.   child_border
client.focused            #152024 #152024 #FDF6E3 #222D31
client.focused_inactive   #152024 #152024 #707880 #222D31
client.unfocused          #222D31 #222D31 #707880 #222D31
