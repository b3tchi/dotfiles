# i3 decoration palette — Jan's client.* colours, ONE source of truth for
# both readers of this block (sp003 Task 6, kwi3-7m8.6).
#
# Split out of i3/config.common, which now `include`s this file at the same
# spot the five lines used to sit. `i3/config.common` includes it with the
# absolute dotfiles path (`~/.dotfiles/i3/colors.conf`, matching how
# i3/config already includes config.common itself); kwi3/config includes it
# as `include ../i3/colors.conf`, resolved by kwi3's own rcfile reader
# relative to the DIRECTORY of the top-level config file it was handed —
# for the real session that is ~/.config/kwi3/config, a symlink rotz makes
# to ~/.dotfiles/kwi3/config, and the host resolves that symlink's TARGET
# before parsing, so `../i3/colors.conf` lands on this exact file
# (i3kwin/core/rcfile.js's header, "the top-level file is the one place a
# symlink is resolved at all").
#
# kwi3's reader (core/rcfile.js, KWI3_RCFILE_CLIENT_KEYS) only maps these
# five `client.<class>` keys — the exact five below, nothing more — so this
# file carries precisely the set both readers understand and nothing a
# second host would have to skip.
#
# client.background is DELIBERATELY NOT HERE, though MEASURED i3 -C
# behaviour says it COULD be (kwi3-7m8.6's bd notes have the three probes).
# i3's variable scoping turns out to be one-directional, not the blanket
# "never crosses a file boundary" the $mod comment in i3/config and
# hotkeyd/i3/config.d/zz-fallback-binds.conf's $qsbarenv/$ws_switch notes
# read as at a glance: a `set` in a file that `include`s another IS visible
# in what it includes (that is exactly how $mod itself reaches
# config.common today — set in i3/config, used throughout the file it
# includes); a `set` made THERE is not visible back in the includer, and
# not visible to an unrelated SIBLING include either, which is the actual
# shape both of those existing comments are about (config.d/*.conf files
# setting a var for one another or for the parent, not for a file that
# includes THEM). config.common `set`s $transp before this file's
# `include` line, so `client.background $transp` moved here would resolve
# correctly today. Kept in config.common anyway, on purpose: colours.conf
# is the set BOTH i3 and kwi3 read (kwi3's KWI3_RCFILE_CLIENT_KEYS maps
# exactly the five client.<class> keys below and nothing else, so
# client.background is of no interest to kwi3 either way), and colocating
# client.background with the `set $transp` it depends on removes an
# order dependency between two files instead of relying on config.common
# never moving that `set` below the `include` line.
#
# class                   border  backgr. text    indic.   child_border
