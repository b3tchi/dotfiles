# nothing-pmos — the Nothing Phone (1) "spacewar" device fixes (postmarketOS),
# installed ON the phone: runs the nothing-pmos repo's own install.sh (usb
# OTG + Clicks charger-plug recovery, suspend, gps/XTRA, dtb audio/camera
# fixes, kernel modules for haptics/glyph/nfc/reboot-mode, sensors,
# bbq20kbd, bluetooth, UCM, lock screen, hardening). Idempotent; one doas
# prompt. It does not build modules or the dtb (that flashes boot_a): run
# `sh install.sh --build` in the clone for that.
#
# SOURCE: the private b3tchi/nothing-pmos repo, branch main, in
# ~/.local/src/nothing-pmos. nothing-pmos/sync.sh fetches it from GitHub over
# ssh (the `github` dot sets that up) and only fast-forwards. A push from the
# dev box still works, for a phone without GitHub access:
#
#   git -C <nothing-pmos worktree> push phone:.local/src/nothing-pmos main
#
# A clone with local changes or on another branch is refused, never reset.
# Tests: nothing-pmos/test-sync.sh.
linux:
  installs:
    depends:
      - github
    cmd: |
      sh "$HOME/.dotfiles/nothing-pmos/sync.sh"
