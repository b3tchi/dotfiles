# draw.io desktop (diagrams, e.g. kwi3 docs/diagrams/*.drawio).
# fonts provides Architects Daughter, the sketch-style font those diagrams use.
windows:
  installs:
    cmd: |
      scoop bucket add extras
      scoop install extras/draw.io

linux:
  installs:
    depends:
      - fonts
    cmd: |
      {{#if (eq whoami.distro "Arch Linux")}}
      sudo pacman -S --needed --noconfirm drawio-desktop
      {{/if}}
      {{#if (eq whoami.distro "Manjaro Linux")}}
      sudo pacman -S --needed --noconfirm drawio-desktop
      {{/if}}
      {{#if (eq whoami.distro "Arch Linux ARM")}}
      sudo pacman -S --needed --noconfirm drawio-desktop
      {{/if}}
