# soloist: Spotify Soloist, Spotify's official headless Spotify Connect
# player (closed source, https://github.com/spotify/soloist).
#
# The installer (main.go, run with `go run`, nothing built into this repo)
# downloads Spotify's build to ~/.local/lib/soloist and, on musl systems
# (postmarketOS), the ~14 MB of glibc libraries it needs: Debian trixie
# packages over HTTPS, checked against the SHA256 in Debian's index,
# unpacked with xz. It writes a soloist-run wrapper there; the link puts a
# `soloist` shim on PATH that runs it.
#
# Builds stop working 90 days after they were built (exit code 10): the
# installer refreshes copies older than 30 days, so re-run
# `rotz install soloist` (or `rotz install radio`) at least monthly.
#
# Setup once: a Soloist API key from the developer dashboard (Soloist page),
# stored with `soloist setup-api-key`, and pairing (`soloist -n NAME --pair`,
# then pick NAME in a Spotify app on the same network). radio does both from
# gopass spotify/soloist-api: `radio --login-device`.
#
# Used by: radio (installs.depends).
linux:
  links:
    soloist: ~/.local/bin/soloist
  installs:
    cmd: |
      if command -v apk >/dev/null 2>&1; then
        missing=""
        command -v go >/dev/null 2>&1 || missing="$missing go"
        command -v xz >/dev/null 2>&1 || missing="$missing xz"
        [ -z "$missing" ] || doas apk add $missing
      fi
      {{#if (eq whoami.distro "Manjaro Linux")}}
      sudo pacman -S --needed --noconfirm go libpulse
      {{/if}}
      {{#if (eq whoami.distro "Arch Linux")}}
      sudo pacman -S --needed --noconfirm go libpulse
      {{/if}}
      {{#if (eq whoami.distro "Arch Linux ARM")}}
      sudo pacman -S --needed --noconfirm go libpulse
      {{/if}}

      # Source dir via akm-root (non-standard clone paths), else ~/.dotfiles.
      SRC="$HOME/.dotfiles/soloist"
      if command -v akm-root >/dev/null 2>&1; then
        ROOT="$(akm-root 2>/dev/null || true)"
        if [ -n "$ROOT" ] && [ -d "$ROOT/soloist" ]; then
          SRC="$ROOT/soloist"
        fi
      fi
      if ! command -v go >/dev/null 2>&1; then
        echo "soloist: go missing -- cannot run the installer." >&2
        exit 1
      fi
      CGO_ENABLED=0 go run -C "$SRC" . || exit 1
