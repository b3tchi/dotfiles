# Unattended Debian 12 i386 install for the Mini 311 (served by pxe-serve.sh).
# Wipes the whole disk. No passwords: root is reachable only by SSH key,
# then thinclient/setup.sh is run over SSH.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string mini311
d-i netcfg/get_domain string
d-i netcfg/hostname string mini311

d-i mirror/country string manual
# mirror-proxy.py on the cable host: no NAT/DNS needed during install.
# late_command points the installed system back at deb.debian.org.
d-i mirror/http/hostname string 10.42.0.1:8080
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# '!' = locked root password; no extra user.
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password !
d-i passwd/make-user boolean false

d-i clock-setup/utc boolean true
d-i time/zone string Europe/Prague
d-i clock-setup/ntp boolean false

d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# security/updates fetched after install (direct hosts unreachable here).
d-i apt-setup/services-select multiselect
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default
d-i finish-install/reboot_in_progress note

# Same key as nix-fleet/modules/common.nix (jan@pc).
d-i preseed/late_command string \
  mkdir -p /target/root/.ssh; \
  echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINcXUjXpfDE34noiIXN12NSSUYcwZqsZgqzFrxB5QFFd jan@pc' > /target/root/.ssh/authorized_keys; \
  chmod 700 /target/root/.ssh; chmod 600 /target/root/.ssh/authorized_keys; \
  printf 'deb http://deb.debian.org/debian bookworm main non-free-firmware\ndeb http://deb.debian.org/debian bookworm-updates main non-free-firmware\ndeb http://security.debian.org/debian-security bookworm-security main non-free-firmware\n' > /target/etc/apt/sources.list
